# cargo-deny configuration — supply-chain policy for the ADK-Rust workspace.
#
# Enforced by the nightly `supply-chain` job (`.github/workflows/ci-nightly.yml`)
# alongside `cargo audit`. Run locally with `cargo deny check`.
#
# The accepted-advisory list is the subset of `.cargo/audit.toml` that cargo-deny
# actually reaches: it resolves the feature graph (so lockfile-only crates never
# appear) and `unmaintained = "workspace"` leaves transitive unmaintained crates
# to upstream. Every entry is justified in
# `docs/security/DEPENDENCY-ADVISORIES.md`; add the rationale there before adding
# an ID here, and remove an ID as soon as `cargo deny check advisories` reports it
# as `advisory-not-detected`.

[graph]
# Optional backends (lancedb, the ONNX audio models, mistral.rs, LiveKit) carry most of the dependency surface. Resolving every feature keeps
# the crates a production deployment actually enables under the gate.
all-features = true

[output]
feature-depth = 1

[advisories]
# Unmaintained advisories are actionable only for dependencies this workspace
# declares. A transitive crate going unmaintained deep in the graph is upstream's
# to replace; failing the build on it turns the gate into noise. Vulnerabilities
# and unsoundness remain errors at any depth.
unmaintained = "workspace"

ignore = [
    # --- Vulnerabilities: reviewed and accepted, see the security doc ---

    # quick-xml 0.26 — memory-exhaustion and quadratic-parse DoS.
    # Reached only as lancedb -> lance-testing -> pprof -> inferno, behind the
    # optional `adk-rag/lancedb` feature. lancedb declares `lance-testing` as a
    # normal (not dev) dependency with `default = []`, so the path cannot be
    # dropped downstream. The crates this workspace declares directly are on the
    # patched line (`adk-eval` requires quick-xml 0.41), and the `[[bans.deny]]`
    # entry below keeps that floor enforced.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # zip < 9 — SUID/SGID bits kept, symlink targets and permissions applied
    # outside the destination, and an abort on a symlink entry with a huge
    # declared size, all in `ZipArchive::extract` / `ZipStreamReader::extract`
    # (0367, 0368, 0369, 0429, 0546); WinZip AES entries returned unauthenticated
    # (0545, `aes-crypto` feature, password reads only); legacy Shrink, Reduce and
    # Implode decoders preallocating a declared size (0547, `legacy-zip` feature);
    # `ZipStreamReader` naming entries by local header (0548).
    # Reached only through third-party wrappers with no release on zip >= 9, both
    # built without `aes-crypto` and `legacy-zip`:
    #   * zip 7.4.0 — adk-audio -> candle-core 0.9 (`adk-audio/qwen3-tts`) and
    #     adk-mistralrs -> mistralrs -> candle-core 0.10. Reads entries by name with
    #     `ZipArchive`; never extracts or streams.
    #   * zip 0.6.6 — adk-realtime -> webrtc-sys-build 0.3.18 (`adk-realtime/livekit`),
    #     pinned because 0.3.21's libwebrtc breaks webrtc-sys 0.3.40. Its build
    #     script extracts LiveKit's own libwebrtc release archive, fetched over HTTPS,
    #     with `ZipArchive`.
    # The crates this workspace declares require zip 9.0.5, and the `[[bans.deny]]`
    # entry below keeps zip 9 enforced.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",

    # libsqlite3-sys 0.37 — bundled SQLite 3.53 returns uninitialised page-cache
    # memory for a database opened with a crafted `-wal` file; only files a less
    # trusted local party wrote are a risk. sqlx-sqlite 0.9.0 (the latest) caps
    # libsqlite3-sys below 0.38, so no fixed copy can be selected. Remove when a
    # sqlx release accepts libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",

    # crypto-bigint 0.5.5 — timing variability in constant-time operations.
    # Reached only through p256 0.13 behind the opt-in `adk-surface/mobile`
    # feature; web-push-native 0.5.0, the latest, requires p256 0.13. Remove when
    # web-push-native releases on p256 0.14.
    "RUSTSEC-2026-0387",

    # ocipkg 0.2.9 — path traversal unpacking a crafted OCI archive. Reached only
    # through intel-mkl-src 0.8.1 (the latest) behind the opt-in
    # `adk-mistralrs/mkl` feature, at build time. Remove when intel-mkl-src
    # releases on ocipkg >= 0.4.1.
    "RUSTSEC-2026-0450",

    # --- Unmaintained crates this workspace declares ---

    # chrono and chrono-tz — marked unmaintained upstream (chronotope/chrono#1768);
    # no release fixes it and the advisories name no vulnerability. `DateTime<Utc>`
    # is in the public API of most crates here, so moving to `jiff` or `time` is a
    # breaking change of its own. Remove when the workspace moves off chrono.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",

    # --- Unsoundness and notices: reviewed, no ADK-reachable path ---
    # http-types: ASCII invariant in Authorization value. Reached only through
    # the Azure SDK's HTTP stack; ADK never constructs http-types headers.
    "RUSTSEC-2026-0174",

    # http-types is informational for cargo-audit and is therefore not listed in
    # `.cargo/audit.toml`.
]

[licenses]
# Permissive licenses plus MPL-2.0. MPL-2.0 is file-level copyleft, satisfied by
# linking without relicensing this workspace; it arrives through the `symphonia`
# audio decoders and the `cssparser`/`selectors` sanitizer stack.
# Unicode-DFS-2016 covers the Unicode name tables embedded by Monty.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# `intel-mkl-src` ships the Intel Simplified Software License, which has no SPDX
# identifier, so the expression is stated explicitly. Every other license-file
# crate is detected from the file it publishes.
[[licenses.clarify]]
crate = "intel-mkl-src"
expression = "LicenseRef-Intel-Simplified-Software-License"
license-files = [{ path = "License.txt", hash = 0x3bf8c2d0 }]

# `inferno` renders flamegraph SVG inside lance-testing's profiler, reached only
# through the optional `adk-rag/lancedb` feature. CDDL-1.0 is OSI-approved,
# file-level copyleft and imposes no obligation on this workspace's own sources.
[[licenses.exceptions]]
crate = "inferno"
allow = ["CDDL-1.0"]

# A non-OSI license, reached only through the opt-in `adk-mistralrs/mkl` feature.
# Allowed per-crate so that enabling the feature is a visible decision rather than
# a silent one. See docs/security/DEPENDENCY-ADVISORIES.md ("Non-OSI dependency
# licenses").
[[licenses.exceptions]]
crate = "intel-mkl-src"
allow = ["LicenseRef-Intel-Simplified-Software-License"]

# `adk-vision-sam-codec` is this workspace's port of the mask codec in Meta's
# `@meta-sam/parser`, a derivative of SAM Materials that clause 1.b.i of the SAM License
# requires to be distributed under that licence. It is the only crate allowed it, reached only
# through the opt-in `adk-vision/sam-codec` feature, which is in no adk-rust tier. See
# docs/security/DEPENDENCY-ADVISORIES.md ("Non-OSI dependency licenses").
[[licenses.clarify]]
crate = "adk-vision-sam-codec"
expression = "LicenseRef-SAM"
license-files = [{ path = "LICENSE", hash = 0x83483f00 }]

[[licenses.exceptions]]
crate = "adk-vision-sam-codec"
allow = ["LicenseRef-SAM"]

[licenses.private]
# `xtask` is the repo-internal task runner (`publish = false`) and carries no
# license field.
ignore = true

[bans]
# Duplicate transitive versions are tolerated: the arrow/lance, opentelemetry,
# and rustls stacks each pin their own line.
multiple-versions = "allow"
wildcards = "deny"
# Internal dev-dependencies are declared path-only (no version) so publish order
# cannot deadlock — see scripts/check-publish-order.py. Those resolve as
# wildcards and are expected.
allow-wildcard-paths = true

[[bans.deny]]
# Keep declared quick-xml usage on the patched line. `inferno` is the sole
# permitted wrapper, matching the documented advisory ignore above.
crate = "quick-xml:<0.41"
wrappers = ["inferno"]

[[bans.deny]]
# Keep declared zip usage on the patched line. The wrappers are the third-party
# crates named in the zip advisory ignore above.
crate = "zip:<9"
wrappers = ["candle-core", "webrtc-sys-build"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
