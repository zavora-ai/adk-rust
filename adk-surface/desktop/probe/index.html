<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; object-src 'none'" />
    <title>ADK-Rust · Can't reach your agents</title>
    <link rel="stylesheet" href="/src/pages.css" />
  </head>
  <body>
    <main class="away" aria-labelledby="away-heading">
      <p class="brand"><span class="dot" aria-hidden="true"></span>ADK-Rust</p>
      <h1 id="away-heading">Can't reach your agents</h1>
      <p class="lead">Start them on this computer and this window comes back by itself.</p>
      <pre class="command"><code>adk-rust up</code></pre>
      <p class="note">The tray reaches agents on this computer only.</p>
    </main>
  </body>
</html>
