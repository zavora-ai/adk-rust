[package]
name = "adk-desktop"
description = "The desktop tray (spec 3.3 §5.5): a Tauri 2 shell over the web home with a tray icon, its badge and the tray panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "adk-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
adk-desktop-core.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-opener = "2.7"
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
base64 = "0.23"
# The WebKitGTK test drives the shell through tauri-driver over plain W3C WebDriver.
reqwest.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
