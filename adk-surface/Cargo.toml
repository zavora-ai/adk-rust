[package]
name = "adk-surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Agent surfaces for ADK-Rust: one engine that turns a kernel's sessions, decisions and activity into plain words for every surface, and the surfaces that show them"
repository.workspace = true
documentation = "https://docs.rs/adk-surface"
readme = "README.md"
# The web home's built assets ship in the crate; its TypeScript source does not.
include = ["src/**/*", "assets/**/*", "Cargo.toml", "README.md"]
keywords = ["adk", "agent", "approvals", "ui", "kernel"]
categories = ["asynchronous", "web-programming"]

# Spec 3.3 §6.1: one feature per surface, none on by default. The engine (feed,
# projection, commands and the rules of §7.2 and §7.4) is always compiled.
[features]
default = []
# The web home (spec 3.3 §5.1, §6): its HTTP API under `/api/surface`, an Axum router mounted
# with `ServerBuilder::add_api_routes`, the feed over server-sent events, and the OpenAPI
# document the TypeScript types are generated from; and the page itself, built from
# `web/` and embedded, mounted with `ServerBuilder::add_root_routes` (§10 S1).
web = ["dep:axum", "dep:rust-embed", "dep:mime_guess"]
# The terminal (spec 3.3 §5.2): full-screen by default, `inline` in the scrollback, and JSON
# lines for CI, all on the engine. Light and dark from the §9 tokens, detected from the
# terminal's background unless set.
tui = ["dep:ratatui", "dep:crossterm", "dep:syntect", "dep:pulldown-cmark", "dep:terminal-colorsaurus", "dep:unicode-width", "tokio/signal", "tokio/io-std", "tokio/io-util"]
# Chat channels (spec 3.3 §5.3, §6.1): the Telegram adapter over the kernel's channel
# contract, reading the Bot API by long polling. It talks to Telegram with `reqwest`, which
# the engine already uses.
channels = ["adk-kernel/channels"]
# The phone (spec 3.3 §5.4, §6.1): the web home installed on a phone, its routes, Web Push
# from the person's own kernel (aes128gcm, the VAPID key signed here with p256), pairing QR
# codes and "Confirm it's you" (passkeys checked by webauthn-rs, which links the system's
# OpenSSL). Implies `web`; its wire types compile under `web`.
mobile = ["web", "dep:web-push-native", "dep:p256", "dep:qrcode", "dep:base64ct", "dep:sha2", "dep:getrandom", "dep:webauthn-rs", "dep:url"]
# Voice and video (spec 3.3 §5.6): spoken "allow once" and "deny" through the engine, with a
# cancel window, the camera and the screen as input only while their switches are on. The
# runtime drives the harness's realtime session (`adk-realtime`); hosts pass the provider
# models, so no provider is compiled in here. With `web`, the voice view's socket.
voice = ["adk-harness/voice", "dep:adk-realtime", "adk-realtime/integration", "dep:sha2", "dep:base64", "axum?/ws"]
# The website's views on the web home (spec 3.5 §7.1, §8.2): the web editor, onboarding, the
# charter cards, the site view and the weekly review over `adk-website`'s desk, with their own
# OpenAPI document and generated TypeScript. Implies `web`.
website = ["web", "dep:adk-website", "dep:base64"]
# Gemini Live and the OpenAI Realtime API, for the live voice test and the `voice_home`
# example only: a host builds its own provider models.
voice-live = ["voice", "adk-realtime/gemini", "adk-realtime/openai"]
# Screen actions people and agents share (spec 3.3 §2 item 7, §5.6, §6.1 `verb-ui`;
# Experimental): snoozing something in Coming up from the home, the terminal, voice and an
# agent, always through the governed path. It adds no dependency; its web, terminal and voice
# parts compile with `web`, `tui` and `voice`.
verb-ui = []
# The workflow observer (spec 3.3 §6.1 `workflow`, §12 developer track): a graph agent's runs,
# steps and forks from its checkpoints, card hints for its governed nodes and the fork command;
# with `web`, its routes under `/api/surface/workflow`. adk-graph with time-travel, which
# adk-harness's default `graph` feature already compiles; adk-harness `web` for the secret
# redaction every shown value passes.
workflow = ["dep:adk-graph", "adk-graph/time-travel", "adk-harness/web"]
# Agent-drawn UI (spec 3.3 §6.1, §7.4 rule 5): the A2UI v0.9.1 model, the embedded `forms` 1.0
# catalog, the validator that keeps approval controls and secrets out of drawings, and the
# render tools agents draw with (`genui::DrawToolset`).
genui = ["dep:jsonschema", "dep:sha2"]

[dependencies]
adk-core.workspace = true
adk-session.workspace = true
adk-runner.workspace = true
# The control-plane client, the process table, freezing and the `/proc` ledger.
adk-kernel.workspace = true
# Modes, `Harness::set_mode` and standing rules for "Always allow"; `kernel` for the
# assessment of agents a person adds (spec 3.3 §5.7).
adk-harness = { workspace = true, features = ["kernel"] }
# The realtime session a voice conversation runs on (`voice`).
adk-realtime = { workspace = true, optional = true }
# The website's desk: its views and the decisions people make on them (`website`).
adk-website = { workspace = true, optional = true }
# Graph agents' checkpoints, records and forks (`workflow`).
adk-graph = { workspace = true, optional = true }
async-trait.workspace = true
axum = { version = "0.8", optional = true }
# Camera and screen frames go to the realtime provider base64-encoded (`voice`).
base64 = { version = "0.22", optional = true }
chrono.workspace = true
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }
futures.workspace = true
# Drawn surfaces checked against the embedded A2UI catalog (`genui`).
jsonschema = { workspace = true, optional = true }
# The approvals inbox in full over the kernel's Unix socket (`ControlSource`).
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = { version = "2.0.5", optional = true }
# The approvals inbox in full over the kernel's HTTP control plane (`ControlSource`).
reqwest.workspace = true
# Agent messages as Markdown, code blocks highlighted (spec 3.3 §6.1 `tui`).
pulldown-cmark = { version = "0.13", optional = true, default-features = false }
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
# The web home's built assets, embedded in the binary (spec 3.3 §6.1 `web`).
rust-embed = { version = "8.9.0", optional = true }
# JSON Schema for every projection and command type, so surfaces and third parties share
# one contract (spec 3.3 §6).
schemars = { version = "1.0", features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
# The terminal's background, for the light or dark theme (`--theme auto`).
terminal-colorsaurus = { version = "1.0", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net"] }
tracing.workspace = true
unicode-width = { version = "0.2", optional = true }
uuid.workspace = true
# The phone (`mobile`): Web Push encryption without its VAPID signer, which pulls jwt-simple;
# the VAPID token is signed here with p256.
web-push-native = { version = "=0.5.0", optional = true, default-features = false }
p256 = { version = "0.13.2", optional = true, default-features = false, features = ["ecdsa", "ecdh", "std"] }
qrcode = { version = "=0.14.1", optional = true, default-features = false, features = ["svg"] }
base64ct = { version = "1.8", optional = true, features = ["alloc"] }
sha2 = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }
# "Confirm it's you" (`mobile`): passkey registration and assertions. Its core links OpenSSL.
webauthn-rs = { version = "=0.5.5", optional = true, default-features = false }
url = { version = "2", optional = true }

[dev-dependencies]
# Internal dev-deps are path-only (no version) so cargo strips them from the published
# manifest.
adk-devtools = { path = "../adk-devtools" }
# The kernel's chat channel contract suite, run against the Telegram adapter.
adk-kernel = { path = "../adk-kernel", features = ["channels", "conformance"] }
# The kernel-hosted harness of the scenario tests.
adk-harness = { path = "../adk-harness", features = ["kernel"] }
adk-model = { path = "../adk-model", default-features = false, features = ["anthropic", "openai", "gemini"] }
# The provider-free realtime model the voice tests and `scripted_voice_home` script.
adk-realtime = { path = "../adk-realtime", features = ["scripted"] }
adk-server = { path = "../adk-server", features = ["approvals"] }
adk-session = { path = "../adk-session", features = ["sqlite", "postgres"] }
# The website's scripted site: its pipeline, wallet and wire types (feature `website`).
adk-site = { path = "../adk-site" }
adk-payments = { path = "../adk-payments" }
awp-types = { path = "../awp-types" }
# The invoice-run workflow of `scripted_workflow` and the workflow tests: a governed HTTP
# node, its draft agent and the SQLite checkpointer (feature `workflow`).
adk-action = { path = "../adk-action" }
adk-agent = { path = "../adk-agent" }
adk-graph = { path = "../adk-graph", features = ["time-travel", "action-http", "sqlite", "postgres"] }
# The fake Telegram Bot API the chat adapter's tests run against.
axum = "0.8"
dotenvy = "0.15"
proptest = "1.5"
tempfile = "3"
# `test-util`: the inbox's timeout tests run on paused time.
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
# Parses what the terminal surface writes, as a terminal would (spec 3.3 WP-E).
vt100 = "0.16"
# The phone's passkey tests rebuild a ceremony around a recorded browser's challenge.
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
# The voice view's socket, opened as a browser would (spec 3.3 §5.6).
tokio-tungstenite = "0.29"
# What the live voice test's provider says, with `RUST_LOG`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The web home over a scripted kernel, which the end-to-end test in `web/e2e` opens.
[[example]]
name = "scripted_home"
required-features = ["web"]

# The tray panel over a scripted kernel with two agents (spec 3.3 §5.5).
[[example]]
name = "scripted_tray"
required-features = ["web"]

# The phone and the home over a scripted kernel, which the phone's end-to-end test opens.
[[example]]
name = "scripted_phone"
required-features = ["mobile"]

# The voice view over a scripted realtime model, which `web/e2e/voice.spec.ts` opens.
[[example]]
name = "scripted_voice_home"
required-features = ["web", "voice"]

# The website's views over a bakery's site, fresh or a week after launch, which the website
# end-to-end tests in `web/e2e` open (spec 3.5 §8.2).
[[example]]
name = "scripted_website"
path = "examples/scripted_website/main.rs"
required-features = ["website"]

# The voice view on Gemini Live or the OpenAI Realtime API, with keys from the repo's `.env`.
[[example]]
name = "voice_home"
required-features = ["web", "voice-live"]

# The web home over a scripted kernel with something in Coming up to snooze and an agent that
# asks to, which `web/e2e/verbs.spec.ts` opens (spec 3.3 §12 "One verb, three origins").
[[example]]
name = "scripted_verbs"
required-features = ["web", "verb-ui"]
# The invoice-run workflow on the web home's Runs tab (spec 3.3 §12 developer track), which
# `web/e2e/workflow.spec.ts` opens; `--live` drafts on whichever provider key is set.
[[example]]
name = "scripted_workflow"
required-features = ["web", "workflow"]

[package.metadata.docs.rs]
all-features = true
