[package]
name = "tool-schemas-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Whether an LlmAgent enforces a #[tool] tool's argument schema, what Gemini receives of it, duplicate tool names at build, and the scripted Llm test double"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-gemini = { path = "../../adk-gemini" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
