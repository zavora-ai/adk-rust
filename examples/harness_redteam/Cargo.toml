[package]
name = "harness-redteam-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Red-team scenarios for the adk-harness shell sandbox and governance (spec 3.1 §11)"

[workspace]

[dependencies]
adk-core = { path = "../../adk-core" }
adk-agent = { path = "../../adk-agent", features = ["coding"] }
adk-devtools = { path = "../../adk-devtools" }
adk-harness = { path = "../../adk-harness", default-features = false, features = ["runner", "sandbox"] }
adk-model = { path = "../../adk-model", features = ["gemini", "openai", "anthropic"] }
adk-runner = { path = "../../adk-runner" }
adk-sandbox = { path = "../../adk-sandbox" }
adk-session = { path = "../../adk-session" }
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
