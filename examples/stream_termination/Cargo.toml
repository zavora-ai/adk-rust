[package]
name = "stream-termination"
version = "0.0.1"
edition = "2024"
publish = false
description = "Model streams that end early or carry an error fail the run instead of persisting a truncated answer"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "groq", "ollama", "openrouter"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
dotenvy = "0.15"
futures = "0.3"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
