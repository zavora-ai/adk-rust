[package]
name = "approval-scoping-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Tool approvals bound to the agent that held the call and the tool it was held for, across durable runs and MCP servers"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "anthropic"] }
adk-realtime = { path = "../../adk-realtime", features = ["scripted"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session", features = ["sqlite"] }
adk-tool = { path = "../../adk-tool", features = ["mcp"] }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
rmcp = { version = "3.1", features = ["client", "server"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
