[package]
name = "release-consistency"
version = "0.0.1"
edition = "2024"
publish = false
description = "Checks for the 3.0 changelog audit: Gemini, Ollama and OpenRouter generation config, stalled-request timeouts, finish reasons, Responses error codes, compaction errors, eval criteria, and allowed hosts"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-eval = { path = "../../adk-eval" }
adk-model = { path = "../../adk-model", default-features = false, features = ["gemini", "gemini-interactions", "openai", "groq", "deepseek", "azure-ai", "ollama", "openrouter", "bedrock"] }
adk-runner = { path = "../../adk-runner", features = ["context-compaction"] }
adk-server = { path = "../../adk-server" }
adk-session = { path = "../../adk-session" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
