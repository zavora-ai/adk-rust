[package]
name = "advanced-agents-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent", features = ["ambient"] }
adk-artifact = { path = "../../adk-artifact" }
adk-core = { path = "../../adk-core", features = ["rustls"] }
adk-memory = { path = "../../adk-memory" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai"] }
adk-realtime = { path = "../../adk-realtime", features = ["openai"] }
adk-runner = { path = "../../adk-runner" }
adk-server = { path = "../../adk-server" }
adk-session = { path = "../../adk-session" }
adk-telemetry = { path = "../../adk-telemetry" }
adk-tool = { path = "../../adk-tool", features = ["mcp"] }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
rmcp = { version = "3.1", features = ["server", "transport-io", "schemars", "macros"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "advanced-runtime"
path = "src/bin/runtime.rs"

[[bin]]
name = "advanced-mcp-server"
path = "src/bin/mcp_server.rs"
