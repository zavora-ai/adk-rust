[package]
name = "mcp-close"
version = "0.0.1"
edition = "2024"
publish = false
description = "Runner::close on LlmAgent + McpToolset: stdio MCP servers exit, HTTP sessions end, composed toolsets close their members, and a closed toolset does not reconnect"

[workspace]

[features]
# Builds against a release without `McpToolset::with_close_timeout`; `close_is_bounded`
# then runs with the default close behaviour.
main-baseline = []

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool", features = ["mcp", "http-transport"] }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
rmcp = { version = "3.1", features = ["client", "server", "transport-child-process"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
