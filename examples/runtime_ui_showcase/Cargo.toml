[package]
name = "runtime-ui-showcase-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent", features = ["team-tools"] }
adk-core = { path = "../../adk-core" }
adk-graph = { path = "../../adk-graph" }
adk-model = { path = "../../adk-model", features = ["openai"] }
adk-server = { path = "../../adk-server" }
adk-session = { path = "../../adk-session" }
adk-telemetry = { path = "../../adk-telemetry" }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }

[[bin]]
name = "runtime-ui-tools"
path = "src/bin/tools.rs"

[[bin]]
name = "runtime-ui-graph"
path = "src/bin/graph.rs"

[[bin]]
name = "runtime-ui-team"
path = "src/bin/team.rs"
