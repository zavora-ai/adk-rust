[package]
name = "tool-outcomes-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "What an LlmAgent tells the model when a tool's after-callbacks fail, a tool errors, a tool times out, or the model sends malformed tool-call JSON"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent", features = ["enhanced-plugins"] }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai"] }
adk-plugin = { path = "../../adk-plugin" }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
