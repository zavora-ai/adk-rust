[package]
name = "run-console-driver"
version = "0.1.0"
edition = "2024"
publish = false
description = "The lifecycle an agent reporting into the computer-use run console has to get right: polling, acknowledgement, cancellation, budgets, redaction and honest completion."

[dependencies]
adk-core = { path = "../../adk-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[workspace]
