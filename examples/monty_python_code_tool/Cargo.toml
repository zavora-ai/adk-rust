[package]
name = "monty-python-code-tool-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "LlmAgent with a REPL-mode MontyPythonCodeTool: OS grants, host functions, and multi-turn state via the Monty interpreter"

# Standalone example crate with its own workspace, like the other examples. It
# depends (through adk-code's `embedded-python` feature) on `monty` from
# crates.io, which requires rustc 1.95+. adk-code pins `get-size2` to 0.10.1
# for monty's `ruff_python_ast 0.0.3` dependency — see the comment in
# adk-code/Cargo.toml.
[workspace]

[dependencies]
adk-core = { path = "../../adk-core" }
adk-agent = { path = "../../adk-agent" }
adk-model = { path = "../../adk-model" }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-code = { path = "../../adk-code", features = ["embedded-python"] }
adk-tool = { path = "../../adk-tool", features = ["code-embedded-python"] }
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
futures = "0.3"
anyhow = "1.0"
dotenvy = "0.15"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
