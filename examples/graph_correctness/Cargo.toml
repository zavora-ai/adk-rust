[package]
name = "graph-correctness-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Graph joins after branches and loops, agent errors inside graphs, and re-entered subgraphs, children and graph tools, through GraphAgent and Runner over a SQLite checkpointer"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-graph = { path = "../../adk-graph", features = ["sqlite"] }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
