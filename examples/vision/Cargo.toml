[package]
name = "vision-scenarios"
version = "0.0.1"
edition = "2024"
publish = false
description = "Spec 3.7 scenarios S1–S19 for adk-vision: the Document desk on local backends, cloud backends on recorded responses, egress, approvals, frames, weights and budgets; the Inspector on a conveyor stream, visual wakes, frame budgets, the live camera surface and native video; the Screen copilot, the Inspector as a team, visual memory and the video analyst; face blur on streams and the on-device profile"

[workspace]

[dependencies]
# S12's Inspector: an LlmAgent whose line stop waits for the person.
adk-agent = { path = "../../adk-agent" }
adk-artifact = { path = "../../adk-artifact" }
# S14: the browser tools the harness governs, over a WebDriver.
adk-browser = { path = "../../adk-browser" }
# S14: the governed computer-use graph's runtime boundary and wire contracts.
adk-computer-use = { path = "../../adk-computer-use" }
adk-core = { path = "../../adk-core" }
# The vision pack: governed vision tools, egress rules and the privacy guardrail (spec 3.7 X15);
# `vision-fixtures` adds the kernel that hosts S10's sleeping Inspector. S14 adds the browser
# and computer-use packs, and `web-fixture` so the browser may open the CRM on loopback.
adk-harness = { path = "../../adk-harness", features = ["vision", "vision-fixtures", "browser", "computer-use", "web-fixture"] }
# S10: the kernel's `VisionWakeSource`, which wakes a sleeping process on a watch event.
adk-kernel = { path = "../../adk-kernel", features = ["vision"] }
# S16, S17: captions with artifact references and the clip in graph memory.
adk-memory = { path = "../../adk-memory", features = ["graph-memory"] }
# ScriptedLlm plans the tool calls; the Anthropic and Gemini clients replay recorded answers.
adk-model = { path = "../../adk-model", default-features = false, features = ["anthropic", "gemini", "muse"] }
# S16, S17: the vector store visual chunks and caption chunks are indexed in.
adk-rag = { path = "../../adk-rag" }
adk-runner = { path = "../../adk-runner" }
# S10: the kernel's durable worker settings.
adk-server = { path = "../../adk-server", features = ["background"] }
adk-session = { path = "../../adk-session" }
# S19 runs S1 again inside the operating system's sandbox, the network denied.
adk-sandbox = { path = "../../adk-sandbox", features = ["sandbox-native", "egress-proxy"] }
# S12: the live camera surface on the frame pipeline, driven without a browser.
adk-surface = { path = "../../adk-surface", features = ["vision-camera"] }
# PP-OCRv6, RF-DETR, SAM 2.1 and YuNet run on the device, fetched by revision and SHA-256; the
# cloud backends are the real clients against a local server. Phase B adds the conveyor clip
# over the in-process RTSP server, the stream pipeline, Gemini native video, and S13's clip read
# through a user-installed ffmpeg when there is one; S18 streams drawn passers-by; S14 grounds a
# copilot's targets through `computer-use`'s target evidence. Phase C adds the perceiver,
# reasoner and verifier (S15), SigLIP 2 visual memory (S16) and the video analyst (S17).
adk-vision = { path = "../../adk-vision", features = ["fetch", "conformance", "guardrail", "onnx", "ocr", "cloud", "nim", "sam", "stream", "rtsp", "ffmpeg", "stream-fixtures", "gemini-video", "computer-use", "team", "memory", "analyst"] }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
# Frames carry their capture time (S11, S13, S18).
chrono = "0.4"
futures = "0.3"
jsonschema = { version = "0.47", default-features = false }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
wiremock = "0.6"

# Pre- and post-processing around ONNX Runtime is slow unoptimised; dependencies build as
# the workspace builds them.
[profile.dev.package."*"]
opt-level = 1
