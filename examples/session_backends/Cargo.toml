[package]
name = "session-backends-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "LlmAgent and Runner over Redis Cluster, standalone Redis, SQLite, Postgres, in-memory, and encrypted sessions: cluster turns, existing standalone data, identifier validation, and history kept across compactions"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session", features = ["redis", "sqlite", "postgres", "encrypted-session"] }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23", features = ["v4"] }
