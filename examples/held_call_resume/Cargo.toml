[package]
name = "held-call-resume"
version = "0.0.1"
edition = "2024"
publish = false
description = "Held tool calls survive compaction, workflow agents, providers without call IDs and run budgets, and run exactly once"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "ollama"] }
adk-runner = { path = "../../adk-runner" }
adk-server = { path = "../../adk-server", features = ["background"] }
adk-session = { path = "../../adk-session", features = ["sqlite"] }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
