[package]
name = "input-validation-persistence"
version = "0.0.1"
edition = "2024"
publish = false
description = "Input guardrails screen a user message before the runner saves it, so blocked or unredacted input never reaches a later model request"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent", features = ["guardrails"] }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-server = { path = "../../adk-server", features = ["background"] }
adk-session = { path = "../../adk-session", features = ["sqlite"] }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
