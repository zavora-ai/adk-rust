[package]
name = "blender-studio-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-core = { path = "../../adk-core" }
adk-agent = { path = "../../adk-agent" }
adk-model = { path = "../../adk-model", features = ["deepseek"] }
adk-tool = { path = "../../adk-tool", features = ["mcp"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
# Needed to implement adk_core::Toolset, which is an #[async_trait].
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
