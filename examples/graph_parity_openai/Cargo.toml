[package]
name = "graph-parity-openai-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-graph = { path = "../../adk-graph", features = ["sqlite"] }
adk-model = { path = "../../adk-model", features = ["openai"] }
