[package]
name = "background-subagents-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Background sub-agents on the agent kernel: notify the parent, follow-ups, cancel, a held call, and a kill -9 resume"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-kernel = { path = "../../adk-kernel" }
adk-model = { path = "../../adk-model", default-features = false, features = ["anthropic"] }
adk-runner = { path = "../../adk-runner" }
adk-server = { path = "../../adk-server", features = ["background", "approvals"] }
adk-session = { path = "../../adk-session", features = ["sqlite"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
dotenvy = "0.15"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
