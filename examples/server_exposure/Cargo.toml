[package]
name = "server-exposure"
version = "0.0.1"
edition = "2024"
publish = false
description = "Server and A2A exposure: loopback bind, cross-origin and DNS-rebinding refusal, input-required tasks, private thinking, strict A2A streams, same-origin agent cards, and error details"

[workspace]

[dependencies]
a2a-protocol-types = "0.12.1"
adk-agent = { path = "../../adk-agent" }
adk-cli = { path = "../../adk-cli", default-features = false, features = ["gemini"] }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "gemini", "anthropic"] }
adk-runner = { path = "../../adk-runner" }
adk-server = { path = "../../adk-server", features = ["a2a-v1", "agent-registry", "background"] }
adk-session = { path = "../../adk-session" }
adk-telemetry = { path = "../../adk-telemetry" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
