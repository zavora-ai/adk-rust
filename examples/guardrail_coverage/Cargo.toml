[package]
name = "guardrail-coverage"
version = "0.0.1"
edition = "2024"
publish = false
description = "Output guardrails screen text a model writes beside a tool call, guardrail blocks carry structured codes, and realtime tool results are screened and their errors redacted before the model sees them"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent", features = ["guardrails"] }
adk-core = { path = "../../adk-core", features = ["rustls"] }
adk-guardrail = { path = "../../adk-guardrail" }
adk-model = { path = "../../adk-model", default-features = false, features = ["anthropic", "openai"] }
adk-realtime = { path = "../../adk-realtime", features = ["openai"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
