[package]
name = "release-live-checks"
version = "0.0.1"
edition = "2024"
publish = false
description = "Live checks for OpenAI Responses background mode, OpenAI Realtime over WebRTC, Gemini Live connect, Groq presets, adk-bench memory metrics, graph recursion limits, and the Ollama token cap"

[workspace]

[features]
default = []
# The OpenAI Realtime WebRTC transport; building it compiles Opus from source and needs cmake.
webrtc = ["adk-realtime/openai-webrtc"]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-bench = { path = "../../adk-bench" }
adk-core = { path = "../../adk-core" }
adk-graph = { path = "../../adk-graph" }
adk-model = { path = "../../adk-model", default-features = false, features = ["gemini", "openai", "groq", "ollama"] }
adk-realtime = { path = "../../adk-realtime", features = ["openai", "gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
