[package]
name = "tools-hardening"
version = "0.0.1"
edition = "2024"
publish = false
description = "LlmAgent + Runner on live models against hostile MCP servers, a scripted Skill Registry, hung auth endpoints and a stand-in container runtime"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-auth = { path = "../../adk-auth", features = ["sso", "token-exchange"] }
adk-code = { path = "../../adk-code" }
adk-core = { path = "../../adk-core" }
adk-gemini = { path = "../../adk-gemini" }
adk-model = { path = "../../adk-model", default-features = false, features = ["gemini", "openai"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-skill = { path = "../../adk-skill", features = ["vertex-skill-registry", "progressive-disclosure"] }
adk-tool = { path = "../../adk-tool", features = ["mcp"] }
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
futures = "0.3"
google-cloud-auth = { version = "1.8", default-features = false, features = ["default-rustls-provider"] }
rmcp = { version = "3.1", features = ["client", "server"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
