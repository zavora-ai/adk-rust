[package]
name = "mcp-protocol-revisions-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "revisions-server"
path = "src/server.rs"

[[bin]]
name = "revisions-agent"
path = "src/main.rs"

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", features = ["gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool", features = ["mcp"] }
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
rmcp = { version = "3.1", features = ["server", "transport-io", "schemars", "macros"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
