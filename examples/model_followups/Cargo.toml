[package]
name = "model-followups"
version = "0.0.1"
edition = "2024"
publish = false
description = "Streamed Ollama usage with a missing count, DeepSeek and Azure AI stream error frames, and Chat Completions refusals, through LlmAgent and Runner"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "deepseek", "ollama", "azure-ai"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
