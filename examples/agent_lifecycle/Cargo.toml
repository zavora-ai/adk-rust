[package]
name = "agent-lifecycle"
version = "0.0.1"
edition = "2024"
publish = false
description = "Transfers, instruction templates, after-agent and after-run stages, model-error plugins, retry-reflect counters, output_key, parallel escalation, on_event and Runner::close"

[workspace]

[features]
# Builds against a release without `Runner::close` and `Toolset::close`; the AR21 scenarios
# report FAIL instead of compiling.
main-baseline = []

[dependencies]
adk-agent = { path = "../../adk-agent", features = ["enhanced-plugins"] }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "gemini"] }
adk-plugin = { path = "../../adk-plugin" }
adk-retry-reflect = { path = "../../adk-retry-reflect" }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
