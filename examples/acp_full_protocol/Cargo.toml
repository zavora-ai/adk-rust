[package]
name = "acp-full-protocol-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[lib]
name = "acp_full_protocol"
path = "src/lib.rs"

[[bin]]
name = "acp-full-protocol"
path = "src/main.rs"

[dependencies]
adk-acp = { path = "../../adk-acp", features = ["server"] }
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool" }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The validating test drives the ADK server through the official SDK's
# in-process duplex channel, so it needs the SDK Client/Channel types directly.
# Pin to the same version adk-acp uses.
agent-client-protocol = "2.2.0"
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
