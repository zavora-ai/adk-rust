[package]
name = "session-integrity-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Runner and adk-server over the in-memory, encrypted, SQLite, PostgreSQL, and Redis session backends: rewind scoping and initial state, get-or-create on transient failures, duplicate creates, typed not-found errors, event order, NUL strings, and list order"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai"] }
adk-runner = { path = "../../adk-runner" }
adk-server = { path = "../../adk-server" }
adk-session = { path = "../../adk-session", features = ["redis", "sqlite", "postgres", "encrypted-session"] }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23", features = ["v4"] }
