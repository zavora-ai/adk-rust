[package]
name = "graph-runtime-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Graph dispatch, streaming, retries, pauses and cancellation through GraphAgent, Runner and the functional API, over in-memory, SQLite and Redis checkpointers"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-graph = { path = "../../adk-graph", features = ["sqlite", "redis", "functional"] }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-rust-macros = { path = "../../adk-rust-macros" }
adk-session = { path = "../../adk-session" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
