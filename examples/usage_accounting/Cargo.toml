[package]
name = "usage-accounting-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Token usage reported with null or missing counts: turns succeed, tools run once, provider_usage is the provider's own object, and run budgets count it"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "anthropic", "gemini", "gemini-interactions", "deepseek", "groq", "ollama"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
