[package]
name = "log-privacy"
version = "0.0.1"
edition = "2024"
publish = false
description = "Error paths keep user data and secrets out of logs and traces unless payload recording is on"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent", features = ["guardrails"] }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["openai", "gemini", "anthropic"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool" }
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
