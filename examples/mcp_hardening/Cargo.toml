[package]
name = "mcp-hardening"
version = "0.0.1"
edition = "2024"
publish = false
description = "LlmAgent + McpToolset against scripted MCP servers: bounded discovery, duplicate names, prefix collisions, annotations, and 5xx handling"

[workspace]

[dependencies]
adk-agent = { path = "../../adk-agent" }
adk-core = { path = "../../adk-core" }
adk-model = { path = "../../adk-model", default-features = false, features = ["gemini"] }
adk-runner = { path = "../../adk-runner" }
adk-session = { path = "../../adk-session" }
adk-tool = { path = "../../adk-tool", features = ["mcp", "http-transport"] }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
futures = "0.3"
rmcp = { version = "3.1", features = ["client", "server"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
