[package]
name = "adk-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Local-first perception for ADK-Rust agents: artifact-backed images, regions in source pixels with their transform chains, model manifests pinned by revision and SHA-256, perception traits with conformance suites, routing with crop escalation, and a governed egress boundary"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-vision"
readme = "README.md"
keywords = ["adk", "agent", "vision", "detection", "ocr"]
categories = ["computer-vision", "asynchronous"]
exclude = ["tests/"]

[package.metadata.docs.rs]
# docs.rs has no CUDA or Metal toolchain, so the GPU features are left out; ort-sys skips
# linking on docs.rs.
features = ["fetch", "conformance", "eval", "guardrail", "onnx", "ocr", "ocr-vl", "cloud", "nim", "sam", "mistralrs"]

# Spec 3.7 §7.1: media, geometry, manifests, the traits, `VisionRuntime`, the egress boundary
# and the deterministic `Editor` always build; each runtime and provider is a feature, added
# by the workstream that brings it (`onnx`, `ocr`, `cloud`, `sam`, `nim`, ...).
[features]
default = []
# The model fetcher: Hugging Face downloads by revision, SHA-256 checked before load (§7.4).
fetch = ["dep:hf-hub", "dep:ureq"]
# The conformance suite every backend runs, and its test macros (§7.18).
conformance = ["tokio/rt-multi-thread"]
# `VisionEvalAgent`: a runtime task answering `adk-eval` cases in the governed tools' response
# form, in process or over the `cargo adk eval` agent protocol (§7.16).
eval = ["dep:futures", "tokio/io-util"]
# `ImagePrivacyGuardrail` as an adk-guardrail `Guardrail` and `ToolGuardrail` and a
# `BeforeModelCallback`, and `PersonalTextRedactor` over `PiiRedactor`'s byte ranges (§7.8).
guardrail = ["dep:adk-guardrail", "dep:base64"]
# Local `ort` backends (§7.6): RF-DETR, EfficientSAM-Ti, SAM 2.1 Tiny and SigLIP 2, with the
# onnxruntime binary downloaded at build time over rustls. Their weights come through the fetcher.
onnx = ["fetch", "dep:ort", "dep:tokenizers", "ort/download-binaries", "ort/tls-rustls", "ort/copy-dylibs"]
# The same backends against an onnxruntime library loaded at run time from `ORT_DYLIB_PATH`,
# for offline and production builds.
onnx-dynamic = ["fetch", "dep:ort", "dep:tokenizers", "ort/load-dynamic"]
# `OnnxExecutionProvider::CoreMl` and `Cuda`; without them a session warns and runs on the CPU.
# `onnx-cuda` downloads the CUDA build of onnxruntime; `onnx-coreml` links only on Apple targets.
onnx-coreml = ["onnx", "ort/coreml"]
onnx-cuda = ["onnx", "ort/cuda"]
# `LlmDescriber` over any `adk_core::Llm` that takes images, with the Gemini, Claude and
# 0-1000 region adapters and provider-formula preflight estimates (§7.7, §7.9).
cloud = ["dep:adk-model", "dep:base64", "dep:futures"]
# NVIDIA NIM (§7.7): the vision-language models over adk-model's OpenAI-compatible client, and
# the document reader over the hosted or self-hosted CV endpoints for OCR, page elements, table
# structure and chart elements.
nim = ["cloud", "adk-model/openai", "dep:reqwest", "dep:base64"]
# The Meta `sam-3.1` client: request building, the stream parser and mask placement (§7.7).
sam = ["dep:adk-model", "adk-model/muse", "dep:base64", "dep:futures", "dep:reqwest", "tokio/io-util", "tokio/process"]
# PP-OCRv6 text lines and words through `oar-ocr` on ONNX Runtime (§7.6), the runtime
# downloaded at build time over rustls as `onnx` does. Weights come through the manifest and
# fetcher; `oar-ocr`'s own ModelScope `auto-download` stays off.
ocr = ["fetch", "dep:oar-ocr", "dep:ort", "ort/download-binaries", "ort/tls-rustls", "ort/copy-dylibs", "oar-ocr/simd", "dep:serde-saphyr"]
# PaddleOCR-VL-1.6 with PP-DocLayoutV3 through `oar-ocr-vl` on Candle (§7.6): layout,
# reading order, tables, formulas and seals.
ocr-vl = ["fetch", "dep:oar-ocr-vl"]
# `ocr-vl` on Apple GPUs through Candle's Metal backend.
ocr-vl-metal = ["ocr-vl", "oar-ocr-vl/metal"]
# `LlmDescriber::mistralrs`: a verified vision-language model (Qwen3-VL) in this process
# through adk-mistralrs (§7.6), `InProcess`, so its images never reach the egress gate.
mistralrs = ["cloud", "fetch", "dep:adk-mistralrs"]
# `mistralrs` on Apple GPUs (Metal) or NVIDIA GPUs (CUDA toolkit required).
mistralrs-metal = ["mistralrs", "adk-mistralrs/metal"]
mistralrs-cuda = ["mistralrs", "adk-mistralrs/cuda"]

[dependencies]
adk-core.workspace = true
# `MediaStore` keeps every image an operation stores as a versioned artifact (§7.2).
adk-artifact.workspace = true
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
# PNG, JPEG and WebP decoding, and GIF's first frame; no other format is accepted (§7.2).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
# `.adk/vision.toml`, the egress rules (§7.8).
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

adk-guardrail = { workspace = true, optional = true }
# `mistralrs`: Qwen3-VL and the other mistral.rs vision models in process.
adk-mistralrs = { workspace = true, optional = true }
# Provider prices for preflight estimates, and the clients `nim` and `sam` build on.
adk-model = { workspace = true, optional = true }
# Base64 images inside tool results (`guardrail`), data URLs and mask payloads (`cloud`, `sam`), and NIM data URIs (`nim`).
base64 = { version = "0.22", optional = true }
futures = { workspace = true, optional = true }
# `sam` streams; `nim`'s CV endpoints take JSON bodies with inline data URIs.
reqwest = { workspace = true, optional = true }

# Same client configuration as adk-rag: the blocking ureq client, no default TLS stack.
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq"] }
# Only to read the HTTP status of a refused download (401 and 403 mean licence acceptance).
ureq = { version = "3", optional = true, default-features = false }
# The workspace `ort` pin; each `onnx*` feature adds how onnxruntime is linked.
ort = { workspace = true, optional = true, features = ["std", "tracing", "api-27"] }
# SigLIP 2's Gemma tokenizer. `onig` alone, as adk-rag: `esaxx_fast` links a static-CRT object
# that rust-lld refuses next to ort's dynamic-CRT objects on MSVC.
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }

# `ocr`: 0.10.x pins `ort` =2.0.0-rc.13, the workspace pin (spec 3.7 Q7).
oar-ocr = { version = "0.10.3", optional = true, default-features = false }
# `ocr`: the character dictionary ships inside PaddlePaddle's `inference.yml`.
serde-saphyr = { workspace = true, optional = true }
# `ocr-vl`: the release matching `oar-ocr`; no `auto-download`.
oar-ocr-vl = { version = "0.10.3", optional = true, default-features = false }

[dev-dependencies]
# Path-only self dependency, so the crate's own tests run the conformance suite.
adk-vision = { path = ".", features = ["conformance"] }
# The governed-toolset scenarios (S1–S4, S7) run through `Runner` and `LlmAgent` with a
# scripted model; the cloud contract tests replay recorded responses through the real
# provider clients.
adk-agent = { path = "../adk-agent" }
# The eval agent scored by `adk-eval`'s vision criteria, in process.
adk-eval = { path = "../adk-eval" }
adk-model = { path = "../adk-model", default-features = false, features = ["anthropic", "gemini", "muse", "openai"] }
adk-runner = { path = "../adk-runner" }
adk-session = { path = "../adk-session" }
futures = { workspace = true }
jsonschema = { workspace = true }
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
wiremock = "0.6"

[[test]]
name = "fetch_tests"
required-features = ["fetch"]

[[test]]
name = "eval_agent_tests"
required-features = ["eval"]

[[test]]
name = "privacy_guardrail_tests"
required-features = ["guardrail"]

[[test]]
name = "governed_toolset_tests"
required-features = ["guardrail"]

[[test]]
name = "egress_property_tests"
required-features = ["guardrail"]

[[test]]
name = "fetch_live_tests"
required-features = ["fetch"]

[[test]]
name = "cloud_tests"
required-features = ["cloud", "nim"]

[[test]]
name = "cloud_live_tests"
required-features = ["cloud", "nim"]

[[test]]
name = "nim_tests"
required-features = ["nim"]

[[test]]
name = "sam_tests"
required-features = ["sam"]

[[test]]
name = "sam_live_tests"
required-features = ["sam"]

[[test]]
name = "ocr_live_tests"
required-features = ["ocr", "fetch", "conformance"]

[[test]]
name = "nim_contract_tests"
required-features = ["nim", "conformance"]

[[test]]
name = "nim_live_tests"
required-features = ["nim", "ocr", "guardrail", "fetch", "conformance"]

[[test]]
name = "ocr_vl_live_tests"
required-features = ["ocr-vl", "fetch", "conformance"]

[[test]]
name = "local_redactor_tests"
required-features = ["onnx", "ocr", "guardrail"]

[[test]]
name = "mistralrs_tests"
required-features = ["mistralrs", "conformance"]
