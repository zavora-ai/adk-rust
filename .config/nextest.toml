# =============================================================================
# cargo-nextest configuration
# =============================================================================
# Docs: https://nexte.st/docs/configuration/
#
# Install: curl -LsSf https://get.nexte.st/latest/mac | tar zxf - -C ~/.cargo/bin
# Run:     cargo nextest run --workspace

[profile.default]
# Run test binaries with moderate parallelism
test-threads = "num-cpus"
# Fail-fast: stop on first failure in CI-like runs
fail-fast = true
# Retry flaky tests once before reporting failure
retries = 0
# Status level controls what gets printed
status-level = "pass"
final-status-level = "flaky"
# Slow test warning threshold
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.ci]
# CI profile: stricter, with retries for flaky network tests
retries = 2
fail-fast = true
status-level = "retry"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# The Firestore emulator serializes contended transactions slowly; its suites get a
# longer budget than the live database servers.
[[profile.default.overrides]]
filter = "binary(store_conformance_firestore)"
slow-timeout = { period = "60s", terminate-after = 4 }

# The durability gates on one server share its stores (schedules are global to a
# store), so they run one at a time per backend; different backends run in parallel.
# Each gate starts several processes and waits out leases and staleness limits.
[test-groups]
durability-gates-postgres = { max-threads = 1 }
durability-gates-redis = { max-threads = 1 }
durability-gates-mongodb = { max-threads = 1 }
durability-gates-neo4j = { max-threads = 1 }
durability-gates-firestore = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(adk-durability-gates) and test(/^postgres::/)"
test-group = "durability-gates-postgres"

[[profile.default.overrides]]
filter = "package(adk-durability-gates) and test(/^redis::/)"
test-group = "durability-gates-redis"

[[profile.default.overrides]]
filter = "package(adk-durability-gates) and test(/^mongodb::/)"
test-group = "durability-gates-mongodb"

[[profile.default.overrides]]
filter = "package(adk-durability-gates) and test(/^neo4j::/)"
test-group = "durability-gates-neo4j"

[[profile.default.overrides]]
filter = "package(adk-durability-gates) and test(/^firestore::/)"
test-group = "durability-gates-firestore"

[[profile.default.overrides]]
filter = "package(adk-durability-gates)"
slow-timeout = { period = "60s", terminate-after = 3 }
