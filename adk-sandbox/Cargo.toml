[package]
name = "adk-sandbox"
description = "Isolated code execution runtime for ADK agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-sandbox"
readme = "README.md"
keywords = ["adk", "sandbox", "code-execution", "wasm", "isolation"]
categories = ["development-tools", "asynchronous"]

[dependencies]
adk-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "io-util", "fs", "rt"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = "3.10"

# Optional dependencies for wasm feature
wasmtime = { version = "48", optional = true }
wasmtime-wasi = { version = "48", optional = true }

# Optional dependencies for workspace feature
tar = { version = "0.4", optional = true }
bollard = { version = "0.18", optional = true }
uuid = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Optional: the Job Objects of `process_tree` (spec 3.2 §10 W1) and the Windows
# restricted-token enforcer API (spec 3.2 §10 W5)
[target.'cfg(windows)'.dependencies]
find-msvc-tools = "0.1.9"
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = ["process"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
process = []  # no extra deps, uses tokio

# Workspace lifecycle (sandbox-agent harness)
workspace = ["dep:tar", "dep:uuid"]
workspace-docker = ["workspace", "dep:bollard", "dep:futures"]

# OS-level sandbox enforcers
sandbox-macos = []       # Seatbelt via sandbox-exec (no extra deps)
sandbox-linux = []       # Bubblewrap via bwrap binary (no extra deps)
sandbox-windows = ["process-tree"]  # restricted-token enforcer via Win32 API (spec 3.2 §10 W5)

# Job Objects that hold a process tree on Windows (spec 3.2 §10 W1); nothing elsewhere.
process-tree = ["dep:windows-sys"]

# Convenience: enables all platform enforcers — only the target platform's code
# compiles due to #[cfg(target_os = "...")] gates inside each module.
sandbox-native = ["sandbox-macos", "sandbox-linux", "sandbox-windows"]

[dev-dependencies]
proptest = "1.4"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

# Document every feature-gated API on docs.rs.
[package.metadata.docs.rs]
all-features = true
