# Generated by adk-deploy for support-desk 1.4.0 from support-desk.
# Secrets come from the Secret 'support-desk-secrets', keys: ADK_API_TOKEN, ANTHROPIC_API_KEY, DATABASE_URL.
# Create it from your secret store before applying, for example with External
# Secrets or `kubectl create secret generic support-desk-secrets --from-env-file=<file>`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-desk
  namespace: agents
  labels:
    app.kubernetes.io/name: support-desk
    app.kubernetes.io/version: "1.4.0"
    app.kubernetes.io/managed-by: adk-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: support-desk
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-desk
        app.kubernetes.io/version: "1.4.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent
        image: "ghcr.io/acme/support-desk:1.4.0"
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ADK_AGENT_NAME
          value: support-desk
        - name: ADK_AGENT_VERSION
          value: "1.4.0"
        - name: ADK_ALLOWED_HOSTS
          value: support.example.com
        - name: ADK_AUTH_MODE
          value: bearer
        - name: ADK_AUTH_REQUIRED_SCOPES
          value: "agent:invoke"
        - name: ADK_DEPLOY_TARGET
          value: container
        - name: BIND_HOST
          value: "0.0.0.0"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_SERVICE_NAME
          value: support-desk
        - name: PORT
          value: "8080"
        - name: RUST_LOG
          value: info
        - name: ADK_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: support-desk-secrets
              key: ADK_API_TOKEN
        - name: ADK_SERVICE_SESSIONS_URL
          valueFrom:
            secretKeyRef:
              name: support-desk-secrets
              key: DATABASE_URL
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: support-desk-secrets
              key: ANTHROPIC_API_KEY
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: support-desk
  namespace: agents
  labels:
    app.kubernetes.io/name: support-desk
    app.kubernetes.io/version: "1.4.0"
    app.kubernetes.io/managed-by: adk-deploy
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: support-desk
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: support-desk
  namespace: agents
  labels:
    app.kubernetes.io/name: support-desk
    app.kubernetes.io/version: "1.4.0"
    app.kubernetes.io/managed-by: adk-deploy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: support-desk
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
