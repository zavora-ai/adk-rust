# Generated by adk-deploy for support-desk 1.4.0. Secrets are read from the environment at
# `docker compose up`; this file holds none.
name: support-desk
services:
  agent:
    image: "ghcr.io/acme/support-desk:1.4.0"
    build:
      context: "../.."
      dockerfile: ".adk-deploy/container/Dockerfile"
    environment:
      ADK_AGENT_NAME: support-desk
      ADK_AGENT_VERSION: "1.4.0"
      ADK_ALLOWED_HOSTS: support.example.com
      ADK_AUTH_MODE: bearer
      ADK_AUTH_REQUIRED_SCOPES: "agent:invoke"
      ADK_DEPLOY_TARGET: container
      BIND_HOST: "0.0.0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: support-desk
      PORT: "8080"
      RUST_LOG: info
      ADK_API_TOKEN: "${ADK_API_TOKEN:?ADK_API_TOKEN must be set in the environment or an --env-file}"
      ADK_SERVICE_SESSIONS_URL: "${DATABASE_URL:?DATABASE_URL must be set in the environment or an --env-file}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set in the environment or an --env-file}"
    ports:
    - "0.0.0.0:8080:8080"
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - "no-new-privileges:true"
    restart: unless-stopped
