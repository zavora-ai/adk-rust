[package]
name = "adk-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-deploy"
readme = "README.md"
description = "Deployment manifest, bundling, and control-plane client for ADK-Rust"
keywords = ["adk", "deploy", "agents", "platform"]
categories = ["development-tools", "config"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
tracing.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
tar.workspace = true
dirs = "6"
url = "2"
# Optional: Agent Engine (ReasoningEngine) deployment client
adk-core = { workspace = true, optional = true }
adk-gcp = { workspace = true, optional = true }
google-cloud-auth = { version = "1.8", optional = true, default-features = false, features = ["default-rustls-provider"] }

[features]
# Agent Engine (ReasoningEngine) BYOC deployment: create/poll/get/delete
gcp = ["adk-core", "adk-gcp", "google-cloud-auth"]

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { workspace = true, features = ["rt", "macros", "net"] }
