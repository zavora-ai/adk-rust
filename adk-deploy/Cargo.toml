[package]
name = "adk-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-deploy"
readme = "README.md"
exclude = ["tests/"]
description = "Deployment manifest, bundling, and control-plane client for ADK-Rust"
keywords = ["adk", "deploy", "agents", "platform"]
categories = ["development-tools", "config"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
tracing.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
tar.workspace = true
dirs = "7"
url = "2"
async-trait.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time"] }
# Optional: Agent Engine (ReasoningEngine) deployment client
adk-core = { workspace = true, optional = true }
adk-gcp = { workspace = true, optional = true }
google-cloud-auth = { version = "1.8", optional = true, default-features = false, features = ["default-rustls-provider"] }
# Optional: Amazon ECS Express Mode deploy target (SigV4 over the documented JSON API)
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sigv4 = { version = "1", optional = true }
# Optional: Azure Container Apps deploy target (ARM REST with DefaultAzureCredential)
azure_core = { version = "0.22", optional = true }
azure_identity = { version = "0.22", optional = true }

[features]
# Agent Engine (ReasoningEngine) BYOC deployment: create/poll/get/delete
gcp = ["dep:adk-core", "dep:adk-gcp", "dep:google-cloud-auth"]
# Amazon ECS Express Mode deploy target: create/describe/update/delete Express services
aws = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4"]
# Azure Container Apps deploy target: create or update, read, and delete container apps
azure = ["dep:azure_core", "dep:azure_identity"]

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { workspace = true, features = ["rt", "macros", "net"] }
wiremock = "0.6"
serde-saphyr.workspace = true

# Document every feature-gated API on docs.rs.
[package.metadata.docs.rs]
all-features = true
