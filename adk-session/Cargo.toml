[package]
name = "adk-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Session management and state persistence for Rust Agent Development Kit (ADK-Rust) agents"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-session"
keywords = ["ai", "agent", "adk", "session", "state"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
adk-core.workspace = true
adk-gcp = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
google-cloud-auth = { version = "1.8", optional = true, default-features = false, features = ["default-rustls-provider"] }
sqlx = { workspace = true, features = ["runtime-tokio", "chrono", "json"], optional = true }
fred = { version = "10", optional = true, features = ["i-scripts"] }
mongodb = { version = "3", optional = true }
firestore = { version = "0.48", optional = true }
# Already a dependency of `firestore`; named directly for the emulator token source.
gcloud-sdk = { version = "0.29", optional = true, default-features = false }
neo4rs = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
adk-core = { path = "../adk-core", features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
axum = "0.8"
futures.workspace = true
http = "1"
proptest = "1.5"
tracing-subscriber = { workspace = true, features = ["fmt"] }

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
database = ["sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs"]
redis = ["fred"]
mongodb = ["dep:mongodb", "tokio"]
firestore = ["dep:firestore", "dep:gcloud-sdk", "sha2", "tokio"]
neo4j = ["dep:neo4rs", "tokio"]
vertex-session = ["adk-gcp", "base64", "google-cloud-auth", "reqwest", "sha2", "tokio"]
encrypted-session = ["aes-gcm", "rand", "base64"]
