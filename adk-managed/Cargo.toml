[package]
name = "adk-managed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Managed agent runtime for ADK-Rust — durable, resumable, provider-neutral agent execution"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-managed"
readme = "README.md"
exclude = ["tests/"]
keywords = ["ai", "agents", "managed", "runtime", "durable"]
categories = ["asynchronous", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
adk-core.workspace = true
adk-agent = { workspace = true }
adk-model = { workspace = true }
adk-runner = { workspace = true }
adk-session.workspace = true
adk-tool.workspace = true
# The built-in tools: `filesystem` through the workspace-contained file tools, `bash` and
# `code_execution` through `BashTool` with a launcher that confines each command.
adk-devtools.workspace = true
# The OS enforcers that confine the built-in tools by default (Seatbelt on macOS, bubblewrap
# on Linux); only the target platform's enforcer compiles.
adk-sandbox = { workspace = true, features = ["sandbox-macos", "sandbox-linux"] }
tempfile = "3.20"

async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
memory = []
full = ["memory"]
# Model providers `DefaultModelResolver` can construct.
gemini = ["adk-model/gemini"]
openai = ["adk-model/openai"]
anthropic = ["adk-model/anthropic"]
ollama = ["adk-model/ollama"]
all-providers = ["gemini", "openai", "anthropic", "ollama"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
# Path-only, so the publish order is not constrained by a dev-dependency.
adk-session = { path = "../adk-session", features = ["sqlite", "postgres"] }
