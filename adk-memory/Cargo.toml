[package]
name = "adk-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Semantic memory and search for Rust Agent Development Kit (ADK-Rust) agents"
repository = "https://github.com/zavora-ai/adk-rust"
documentation = "https://docs.rs/adk-memory"
keywords = ["ai", "agent", "adk", "memory", "semantic"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[dependencies]
adk-core.workspace = true
adk-gcp = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "chrono", "json"], optional = true }
# 0.4.2 moved its SQLx integration to 0.9, while the workspace uses SQLx 0.8.
pgvector = { version = "=0.4.1", features = ["sqlx"], optional = true }
mongodb = { version = "3", optional = true }
neo4rs = { version = "0.8", optional = true }
fred = { version = "10", optional = true }
reqwest = { workspace = true, optional = true }
google-cloud-auth = { version = "1.8", optional = true, default-features = false, features = ["default-rustls-provider"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
proptest = "1.5"
serde_json.workspace = true
chrono.workspace = true
axum = "0.8"
uuid = { version = "1.23", features = ["v4"] }

[features]
default = []
# Exposes only the EmbeddingProvider trait without heavy DB dependencies
embedding-trait = []
sqlite-memory = ["sqlx/sqlite"]
# Knowledge-graph (bi-temporal) memory backend, SQLite-backed.
# Reuses the SQLite migration runner from the sqlite-memory backend.
graph-memory = ["sqlite-memory"]
database-memory = ["sqlx/postgres", "pgvector"]
redis-memory = ["fred"]
mongodb-memory = ["dep:mongodb"]
neo4j-memory = ["dep:neo4rs"]
# Vertex AI Agent Engine Memory Bank backend (memories:generate / memories:retrieve)
vertex-memory = ["adk-gcp", "google-cloud-auth", "reqwest"]
