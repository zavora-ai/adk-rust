[package]
name = "adk-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Developer tools (read/write/edit/grep/glob/bash) for ADK-Rust coding agents, scoped to a sandboxed workspace"
repository.workspace = true
documentation = "https://docs.rs/adk-devtools"
readme = "README.md"
keywords = ["adk", "agent", "coding", "tools", "filesystem"]
categories = ["development-tools", "asynchronous"]

[dependencies]
adk-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "io-util", "rt", "macros"] }
regex.workspace = true
walkdir = "2.5"
glob = "0.3"

# Only used for the process-group kill that stops a timed-out command's descendants.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The handle-verified opens of the file tools and the Job Object that stops a `bash`
# command's descendants (spec 3.2 §10 W1, W6).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

# The bash boundary tests are `#![cfg(unix)]` and probe liveness with `libc::kill`.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
