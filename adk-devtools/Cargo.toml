[package]
name = "adk-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Developer tools (read/write/edit/grep/glob/bash) for ADK-Rust coding agents, scoped to a sandboxed workspace"
repository.workspace = true
documentation = "https://docs.rs/adk-devtools"
readme = "README.md"
keywords = ["adk", "agent", "coding", "tools", "filesystem"]
categories = ["development-tools", "asynchronous"]

[dependencies]
adk-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "io-util", "rt", "macros"] }
regex.workspace = true
walkdir = "2.5"
glob = "0.3"

# Only used for the process-group kill that stops a timed-out command's descendants.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The handle-verified opens of the file tools (spec 3.2 §10 W6), and the Job Object that
# stops a `bash` command's descendants (W1), which `adk-sandbox` shares with the MCP
# server manager and the restricted-token enforcer.
[target.'cfg(windows)'.dependencies]
adk-sandbox = { workspace = true, features = ["process-tree"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

# The bash boundary tests are `#![cfg(unix)]` and probe liveness with `libc::kill`.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The Job Object tests wait for and end the processes a command started, and the contained
# tests start them under the restricted-token enforcer; the in-place reparse point test sets
# a reparse point (spec 3.2 §10 W1, W5, W6).
[target.'cfg(windows)'.dev-dependencies]
adk-sandbox = { path = "../adk-sandbox", features = ["sandbox-windows"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
