[package]
name = "adk-codeact-monty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Python CodeRuntime for the ADK-Rust CodeActAgent, backed by the Pydantic Monty interpreter"
repository = "https://github.com/zavora-ai/adk-rust"
documentation = "https://docs.rs/adk-codeact-monty"
keywords = ["ai", "agent", "adk", "python", "codeact"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[dependencies]
adk-core = { workspace = true }
adk-agent = { workspace = true, features = ["codeact"] }
# The shared Monty integration kernel: JSON<->Monty conversion, OS-call
# servicing, `PathAccess`, and re-exports of the `monty`/`monty-types`/
# `monty-fs` crates — so the Monty release is pinned exactly once, by
# adk-code, and this crate cannot drift from it. See adk-code/Cargo.toml for
# the pin rationale (including the `get-size2` lockfile pin).
adk-code = { workspace = true, features = ["embedded-python"] }
serde_json = { workspace = true }

[dev-dependencies]
# Only needed by the unit test that defines a sample `Tool`. The runnable
# example lives in `examples/codeact_monty_agent` as a standalone crate.
async-trait = { workspace = true }
# Temp directories for the filesystem-access integration tests.
tempfile = "3"
# The action-ledger tests drive a real CodeActAgent through a Runner. Internal
# dev-dependencies are path-only so they never constrain the publish order.
adk-runner = { path = "../adk-runner" }
adk-session = { path = "../adk-session" }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
