[package]
name = "adk-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-acp"
readme = "README.md"
description = "Agent Client Protocol integration for ADK-Rust — use ACP coding agents or expose an ADK agent to editors"
keywords = ["adk", "acp", "agent", "protocol", "ai"]
categories = ["development-tools", "asynchronous"]

[features]
default = []
server = ["dep:adk-runner", "dep:adk-session", "dep:adk-tool", "dep:rmcp", "dep:tokio-util", "dep:uuid", "dep:async-stream", "dep:blocking"]

[dependencies]
adk-core = { workspace = true }
# ACP protocol v1 through the official SDK. `~5.2.0` takes patch releases only:
# the SDK may change its `unstable_*` surfaces in any 5.x minor release, and
# adk-acp re-exports the crate.
#
# The unstable v1 features below are the ones adk-acp implements on both sides
# and advertises only where implemented:
# - `unstable_session_fork`: `session/fork`
# - `unstable_session_archive`: `session/archive`, `session/unarchive`, archived listing
# - `unstable_session_status`: `session/status`
# - `unstable_session_options`: `session/options`, initial config options
# - `unstable_session_set_title`: `session/set_title`
# - `unstable_auth_status`: `auth/status`, `auth/status_update`
# - `unstable_end_turn_token_usage`: `PromptResponse.usage`
# - `unstable_plan_operations`: plan updates and removals
# - `unstable_subagents`: subagent session updates
# - `unstable_mcp_over_acp`: `McpServer::Acp` and `mcp/message` (MCP 2026-07-28)
# - `unstable_llm_providers`: `providers/list`, `providers/set`, `providers/disable`
agent-client-protocol = { version = "~5.2.0", features = [
    "process",
    "stdio",
    "unstable_auth_status",
    "unstable_end_turn_token_usage",
    "unstable_llm_providers",
    "unstable_mcp_over_acp",
    "unstable_plan_operations",
    "unstable_session_archive",
    "unstable_session_fork",
    "unstable_session_options",
    "unstable_session_set_title",
    "unstable_session_status",
    "unstable_subagents",
] }
async-trait = { workspace = true }
base64 = "0.22"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "process", "io-util", "io-std", "macros", "rt", "time"] }
tracing = { workspace = true }

# Server-specific dependencies (behind `server` feature)
adk-runner = { workspace = true, optional = true }
adk-session = { workspace = true, optional = true }
adk-tool = { workspace = true, features = ["mcp"], optional = true }
rmcp = { version = "3.1", features = ["client", "transport-child-process"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
uuid = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
# Unblocked stdin and stdout for the server transport, as the SDK's own `Stdio` uses them.
blocking = { version = "1.6", optional = true }

[dev-dependencies]
# Internal dev-deps are path-only (no version) so cargo strips them from the
# published manifest — they can never block or reorder a crates.io publish.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
proptest = "1.5"
adk-session = { path = "../adk-session" }
adk-runner = { path = "../adk-runner" }
adk-agent = { path = "../adk-agent" }
# Server side of rmcp, used only to serve in-process MCP catalogs in tests.
rmcp = { version = "3.1", features = ["client", "server"] }

# Document every feature-gated API on docs.rs.
[package.metadata.docs.rs]
all-features = true
