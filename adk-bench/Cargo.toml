[package]
name = "adk-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Benchmarking framework for ADK-Rust agent performance measurement"
repository = "https://github.com/zavora-ai/adk-rust"
documentation = "https://docs.rs/adk-bench"
readme = "README.md"
homepage.workspace = true
keywords = ["ai", "agent", "benchmark", "performance", "adk"]
categories = ["development-tools::profiling"]

[dependencies]
adk-core.workspace = true
adk-agent.workspace = true
adk-runner.workspace = true
adk-model = { workspace = true, features = ["gemini"] }
adk-eval.workspace = true
adk-tool.workspace = true
adk-session.workspace = true

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "process", "sync", "fs"] }
tracing.workspace = true
chrono.workspace = true
futures.workspace = true
libc = "0.2"
adk-vision = { workspace = true, optional = true }
# Scales the latency image to each input size.
image = { version = "0.25", default-features = false, optional = true }
# The onnxruntime build the ONNX rows ran on, for the report (`vision-onnx`).
ort = { workspace = true, optional = true }

[features]
default = []
# τ²-bench task quality adapter
tau2 = []
# BFCL (Berkeley Function Calling Leaderboard) task quality adapter
bfcl = []
# Vision benchmarks and the vision adapter (spec 3.7 §7.17): the harness, the committed eval
# sets as workloads, and cloud backends replayed from recordings. Backends come with the
# features below.
vision = ["dep:adk-vision", "adk-vision/eval", "dep:image"]
# RF-DETR, EfficientSAM, SAM 2.1 and SigLIP 2 on ONNX Runtime.
vision-onnx = ["vision", "adk-vision/onnx", "dep:ort"]
# The ONNX backends on CoreML (Apple).
vision-coreml = ["vision-onnx", "adk-vision/onnx-coreml"]
# PP-OCRv6 tiny and small.
vision-ocr = ["vision", "adk-vision/ocr"]
# PaddleOCR-VL-1.6 on the CPU, and on Apple GPUs.
vision-ocr-vl = ["vision", "adk-vision/ocr-vl"]
vision-ocr-vl-metal = ["vision-ocr-vl", "adk-vision/ocr-vl-metal"]
# Claude and NVIDIA NIM describers and Meta sam-3.1, recorded or live.
vision-cloud = ["vision", "adk-vision/cloud", "adk-vision/nim", "adk-vision/sam", "adk-model/anthropic"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "io-std"] }
tempfile = "3"
# The vision example serves recorded cloud responses to the real clients.
wiremock = "0.6"

[[example]]
name = "vision_bench"
required-features = ["vision"]
