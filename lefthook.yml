# Lefthook configuration — enforces the ADK-Rust Quality Gates locally.
# See CONTRIBUTING.md "3. Develop with Quality Gates".
#
# pre-commit: fast format + lint checks (zero warnings).
# pre-push:   workspace compilation check before code leaves your machine.
#             This is a fast `cargo check` gate — CI runs the full test suite
#             as the safety net, so pushes stay quick while regressions are
#             still caught before merge.
#
# The gates run `cargo <tool> --workspace`, which only builds the workspace
# members — the `adk-*`, `awp-*`, and `cargo-adk` crates plus the root manifest.
# The standalone `examples/*` crates (and reference/learning dirs) are EXCLUDED
# from the workspace, so changes there don't affect these gates. The globs are
# therefore scoped to workspace-member paths only; an example-only change skips
# every gate.
#
# Each gate globs just the inputs that affect it:
#   - fmt        Rust sources, rustfmt.toml, and the toolchain.
#   - clippy     also Cargo manifests, the lockfile, .cargo/config.toml, and
#                .clippy.toml (anything that changes compilation or lints).
#   - shellcheck shell scripts only. The non-Nix counterpart to the shellcheck
#                hook in devenv.nix. Lints just the staged scripts. Runs at
#                --severity=warning so info-level notes (e.g. SC1091 about
#                sourced files that can't be followed) don't block commits;
#                real warnings and errors still fail.
#   - check      mirrors clippy's compile inputs — a workspace compilation
#                check without running the tests.
#
# Glob notes (lefthook's matcher): `*` crosses `/`, so `adk-*/*.rs` matches
# Rust files at any depth under an `adk-*` crate, and patterns are anchored at
# the path start (so `examples/...` never matches). Workspace members share a
# single root Cargo.lock — there are no per-member lockfiles to glob.
#
# Install hooks once with: lefthook install

pre-commit:
  parallel: false
  commands:
    fmt:
      tags: format
      glob:
        - "adk-*/*.rs"
        - "xtask/*.rs"
        - "awp-*/*.rs"
        - "cargo-adk/*.rs"
        - "rustfmt.toml"
        - "rust-toolchain.toml"
      run: cargo fmt --all -- --check
      fail_text: "Formatting check failed. Run `cargo fmt --all` to fix."
    clippy:
      tags: lint
      glob:
        - "adk-*/*.rs"
        - "xtask/*.rs"
        - "awp-*/*.rs"
        - "cargo-adk/*.rs"
        - "adk-*/Cargo.toml"
        - "xtask/Cargo.toml"
        - "awp-*/Cargo.toml"
        - "cargo-adk/Cargo.toml"
        - "Cargo.toml"
        - "Cargo.lock"
        - ".cargo/config.toml"
        - "rust-toolchain.toml"
        - ".clippy.toml"
      run: cargo clippy --workspace --all-targets -- -D warnings
      fail_text: "Clippy found warnings. Fix them before committing (zero-warnings policy)."
    shellcheck:
      tags: lint
      glob: "*.sh"
      run: shellcheck --severity=warning {staged_files}
      fail_text: "shellcheck found issues. Run `shellcheck --severity=warning <file>` to see them."
    # PowerShell counterpart to the shellcheck gate, for scripts/*.ps1 (Windows
    # has no POSIX shell, so setup-dev.ps1 is the only Windows setup path). The
    # logic lives in scripts/lint-powershell.ps1 because lefthook pipes commands
    # through `sh` on Unix, which would mangle an inline script's `$` variables.
    # `powershell` is the 5.1 interpreter every Windows host ships; `pwsh` is
    # PowerShell 7 and is not guaranteed to be installed.
    psscriptanalyzer:
      tags: lint
      glob: "*.ps1"
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint-powershell.ps1 {staged_files}
      fail_text: "PSScriptAnalyzer found issues. Run `./scripts/lint-powershell.ps1 <file>` to see them."

pre-push:
  commands:
    check:
      tags: check
      glob:
        - "adk-*/*.rs"
        - "xtask/*.rs"
        - "awp-*/*.rs"
        - "cargo-adk/*.rs"
        - "adk-*/Cargo.toml"
        - "xtask/Cargo.toml"
        - "awp-*/Cargo.toml"
        - "cargo-adk/Cargo.toml"
        - "Cargo.toml"
        - "Cargo.lock"
        - ".cargo/config.toml"
        - "rust-toolchain.toml"
      run: cargo check --workspace
      fail_text: "Workspace failed to compile. Fix build errors before pushing."

    # The standalone examples are outside the workspace, so `cargo check
    # --workspace` never compiles them and only CI's four example shards do. That
    # let two breakages reach CI: a DeferredNodeConfig field addition fixed in
    # seven places and missed in an eighth, and a lockfile that `--locked`
    # rejected. This runs the same script CI runs, over every shard, and only when
    # something an example depends on has changed.
    #
    # Globs include the workspace crates because an example depends on them by
    # path: changing a public API or a manifest can break an example while the
    # workspace itself still compiles.
    examples:
      tags: check
      glob:
        - "examples/**/*.rs"
        - "examples/**/Cargo.toml"
        - "examples/**/Cargo.lock"
        - "adk-*/src/**/*.rs"
        - "adk-*/Cargo.toml"
        - "awp-*/Cargo.toml"
        - "Cargo.toml"
      run: |
        set -e
        for shard in 0 1 2 3; do
          bash scripts/check-examples-compile.sh "$shard" 4
        done
      fail_text: "A standalone example failed to compile. CI's examples-compile job will fail too."
