[package]
name = "adk-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Governed, durable harness agent for ADK-Rust: modes, standing approvals, shell, todos, instructions and skills over one governed tool path"
repository.workspace = true
documentation = "https://docs.rs/adk-harness"
readme = "README.md"
keywords = ["adk", "agent", "harness", "coding", "governance"]
categories = ["development-tools", "asynchronous"]

# Feature set of spec 3.1 §7.1. Packs (browser, computer-use, payments, voice,
# managed) are off by default.
[features]
default = ["runner", "skills", "team", "graph", "sandbox", "observe", "auth", "memory"]
# The `Harness` wrapper that owns a Runner.
runner = ["dep:adk-runner", "dep:adk-session"]
# Progressive skill disclosure (`list_skills`, `load_skill`, `load_skill_resource`).
skills = ["dep:adk-skill", "adk-skill/progressive-disclosure", "adk-agent/skills"]
# Skills from the Vertex AI Skill Registry (`search_skills`).
skills-registry = ["skills", "adk-skill/vertex-skill-registry"]
# Team members lowered to a `TeamSpec` (spec 3.1 §7.10).
team = ["dep:adk-tool", "adk-agent/team-tools"]
# Claude Code, Codex and Kiro as members over ACP.
team-acp = ["team", "dep:adk-acp"]
# Remote agents as members over A2A.
team-a2a = ["team", "dep:adk-server"]
# Goals started by cron, file-watch and webhook triggers (spec 3.1 §7.11).
ambient = ["runner", "adk-agent/ambient"]
# Plan graph and goal engine (spec 3.1 §7.11).
graph = ["dep:adk-graph", "adk-graph/time-travel", "adk-graph/action"]
# OS sandbox for the shell (spec 3.1 §7.9).
sandbox = ["dep:adk-sandbox", "adk-sandbox/sandbox-native"]
# Container isolation for the shell.
docker = ["sandbox", "adk-sandbox/workspace-docker"]
# Spans, spend and the loop guard (spec 3.1 §7.13).
observe = ["dep:adk-telemetry", "dep:adk-eval"]
# RBAC wrappers, credential broker and signed audit (spec 3.1 §7.14).
auth = ["dep:adk-auth", "adk-auth/signed-audit"]
# Working notes and long-term facts (spec 3.1 §7.15); adk-memory for `MemoryServiceIndex`.
memory = ["dep:adk-memory", "adk-memory/embedding-trait", "dep:adk-guardrail", "dep:regex"]
# `RagEmbedder`: adk-rag's OpenAI and Gemini embedders for long-term facts (spec 3.1 §7.15.2).
memory-embeddings = ["memory", "dep:adk-rag", "adk-rag/openai", "adk-rag/gemini"]
# `RagEmbedder::onnx`: adk-rag's `OnnxEmbeddingProvider`, a sentence-transformer run in
# process, so recall needs no network and no provider key (spec 3.1 §7.15.2, §10 R1).
memory-embeddings-local = ["memory", "dep:adk-rag", "adk-rag/onnx"]
# Graph memory tools from adk-memory.
memory-graph = ["memory", "dep:adk-memory"]
# Hooks on tool events from `.adk/harness.toml`, the user config and the builder (spec 3.1 §7.22).
hooks = []
# SQLite backends for the mode, standing-rule and shell-ledger stores.
sqlite = ["dep:sqlx", "sqlx/sqlite", "adk-graph?/sqlite", "adk-session?/sqlite"]
# The store envelope of spec 3.1 §7.12: sessions, approvals and the SQLite stores sealed
# under one keyring from a secret provider, the OS keychain or an environment variable.
encrypted = ["dep:adk-session", "adk-session/encrypted-session", "dep:keyring"]
# Packs (spec 3.1 §7.16–§7.18, §7.24).
# The browser pack (spec 3.1 §7.24): `web` for the §7.20 allowlist, URL checks and screening.
browser = ["dep:adk-browser", "web"]
# The computer-use pack (spec 3.1 §7.24): `graph` for the reference graph's checkpointer.
computer-use = ["dep:adk-computer-use", "graph"]
# The payments pack (spec 3.1 §7.16): `adk-auth` for the scope guard its tools run under.
payments = ["dep:adk-payments", "dep:adk-auth"]
voice = ["dep:adk-realtime"]
# The managed form (spec 3.1 §7.18): adk-managed runs on adk-runner and adk-session already.
managed = ["runner", "dep:adk-managed"]
# Governed web access: web_fetch, web_search, screening (spec 3.1 §7.20).
web = ["dep:reqwest", "dep:adk-guardrail", "dep:regex", "dep:adk-tool"]
# MCP interaction: elicitation, sampling and resource bridges (spec 3.1 §7.21).
mcp = ["dep:adk-tool", "adk-tool/mcp", "adk-tool/mcp-sampling"]
# Test fixtures only: lets a loopback HTTP server stand in for the web (never on in adk-cli).
web-fixture = ["web"]

[dependencies]
adk-core.workspace = true
adk-agent.workspace = true
adk-devtools.workspace = true
adk-runner = { workspace = true, optional = true }
adk-session = { workspace = true, optional = true }
adk-skill = { workspace = true, optional = true }
adk-tool = { workspace = true, optional = true }
adk-acp = { workspace = true, optional = true }
adk-server = { workspace = true, optional = true }
adk-graph = { workspace = true, optional = true }
adk-sandbox = { workspace = true, optional = true }
adk-telemetry = { workspace = true, optional = true }
adk-eval = { workspace = true, optional = true }
adk-auth = { workspace = true, optional = true }
adk-memory = { workspace = true, optional = true }
adk-guardrail = { workspace = true, optional = true }
adk-rag = { workspace = true, optional = true }
adk-browser = { workspace = true, optional = true }
adk-computer-use = { workspace = true, optional = true }
adk-payments = { workspace = true, optional = true }
adk-realtime = { workspace = true, optional = true }
adk-managed = { workspace = true, optional = true }
async-stream.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs = "7"
futures.workspace = true
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true, features = ["runtime-tokio"] }
tokio = { workspace = true, features = ["sync", "time", "fs", "rt", "macros", "process", "io-util"] }
# `.adk/harness.toml` (spec 3.1 §8.3, §7.22).
toml.workspace = true
tracing.workspace = true
unicode-normalization = "0.1"
uuid.workspace = true

# The hook runner starts each hook in its own session and kills its process group, as the
# devtools bash does.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The OS keychain behind `StoreKeySource::Keychain` (feature `encrypted`), the same
# configuration adk-cli uses.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
adk-model = { path = "../adk-model", default-features = false }
# SQLite sessions, approvals and ledger, and the durable worker, for the durability tests;
# `encrypted-session` for the encrypted store conformance suite.
adk-session = { path = "../adk-session", features = ["sqlite", "encrypted-session"] }
adk-server = { path = "../adk-server", features = ["background", "agent-engine"] }
# `MemoryServiceIndex` conformance over the SQLite FTS5 and PostgreSQL backends.
adk-memory = { path = "../adk-memory", features = ["sqlite-memory", "database-memory"] }
sqlx = { workspace = true, features = ["postgres", "sqlite"] }
proptest = "1.5"
# Scripted MCP servers for the elicitation, sampling and resource tests.
rmcp = { version = "3.1", features = ["server", "client", "elicitation"] }
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
# Captures the harness spans in the observability tests.
tracing-subscriber = { workspace = true, features = ["registry"] }
# The managed form's replay to an `adk-enterprise` client over a local HTTP surface, and
# the Agent Engine dispatch served locally (spec 3.1 §7.18, H9).
adk-enterprise = { path = "../adk-enterprise" }
axum = "0.8"
reqwest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
