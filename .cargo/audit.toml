# =============================================================================
# cargo-audit configuration
# =============================================================================
# Advisories listed here have been reviewed and accepted per the risk
# assessment documented in docs/security/DEPENDENCY-ADVISORIES.md.
#
# Run `cargo audit` locally or in CI — these IDs will be skipped while
# new, unreviewed advisories still surface as failures.
#
# This list is wider than deny.toml's: cargo-audit scans the lockfile, so it
# also reports crates that no resolved feature graph reaches and transitive
# unmaintained crates that cargo-deny's `unmaintained = "workspace"`
# policy deliberately leaves to upstream.

[advisories]
ignore = [
    # quick-xml 0.26: memory-exhaustion and quadratic-parse DoS. Reached only as
    # lancedb -> lance-testing -> pprof -> inferno, behind the optional
    # `adk-rag/lancedb` feature; lancedb declares `lance-testing` as a normal
    # dependency so the path cannot be dropped downstream. Crates this workspace
    # declares directly are on the patched line (adk-eval requires 0.41), and
    # deny.toml bans quick-xml < 0.41 outside the inferno path.
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",

    # zip < 9: SUID/SGID bits kept, symlink targets and permissions applied
    # outside the destination, and an abort on a symlink entry with a huge
    # declared size — all in `ZipArchive::extract` and
    # `ZipStreamReader::extract`. Crates this workspace declares require zip 9
    # (adk-skill, adk-cli), and deny.toml bans zip < 9 outside the wrappers below.
    # No release of either wrapper depends on zip >= 9.
    #   * zip 6.0.0: adk-audio -> ndarray-npy 0.10.0 (`npz`), feature
    #     `adk-audio/kokoro`. `NpzReader` reads entries by name; never extracts.
    #   * zip 7.4.0: adk-audio -> candle-core 0.9.2 (also via qwen_tts 0.1.1),
    #     feature `adk-audio/qwen3-tts`; adk-mistralrs -> mistralrs 0.8.1 ->
    #     candle-core 0.10.2. candle reads `.npz`/`.pth` entries by name and
    #     writes `.npz`; never extracts.
    #   * zip 0.6.6: adk-realtime -> webrtc-sys-build 0.3.18, feature
    #     `adk-realtime/livekit`; pinned because 0.3.21's libwebrtc breaks
    #     webrtc-sys 0.3.40. Its build script extracts LiveKit's own libwebrtc
    #     release archive, fetched over HTTPS.
    # Remove when ndarray-npy, qwen_tts and mistralrs release on zip >= 9, and
    # webrtc-sys-build's pin goes with the livekit 0.8.4 stack.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",

    # libsqlite3-sys 0.37 bundles SQLite 3.53, which can return uninitialised
    # page-cache memory for a database opened with a crafted `-wal` file. Only
    # files a less trusted local party wrote are a risk; ADK opens databases at
    # paths its operator configures. sqlx-sqlite 0.9.0 (the latest sqlx) caps
    # libsqlite3-sys below 0.38 and `links = "sqlite3"` allows one copy, so
    # rusqlite cannot move either. Remove when a sqlx release accepts
    # libsqlite3-sys >= 0.39; then raise adk-telemetry's rusqlite to 0.41.
    "RUSTSEC-2026-0459",

    # crypto-bigint 0.5.5: timing variability in operations meant to be
    # constant-time. Reached only as adk-surface -> p256 0.13 (and
    # web-push-native 0.5.0, the latest, on p256 0.13), behind the opt-in
    # `adk-surface/mobile` feature that signs VAPID tokens. Remove when
    # web-push-native releases on p256 0.14, and move adk-surface to 0.14 with it.
    "RUSTSEC-2026-0387",

    # ocipkg 0.2.9: path traversal unpacking a crafted OCI archive. Reached only
    # as adk-mistralrs -> mistralrs -> candle-core -> intel-mkl-src (0.8.1, the
    # latest), behind the opt-in `adk-mistralrs/mkl` feature, whose build script
    # downloads Intel's MKL image from a fixed registry. Remove when
    # intel-mkl-src releases on ocipkg >= 0.4.1.
    "RUSTSEC-2026-0450",

    # --- Unmaintained crates (no security impact) ---

    # async-std: Discontinued runtime, transitive shim only
    "RUSTSEC-2025-0052",
    # atomic-polyfill: Polyfill for non-std targets, ADK uses std only
    "RUSTSEC-2023-0089",
    # audiopus_sys: Unmaintained opus FFI bindings
    "RUSTSEC-2026-0150",
    # backoff: Pure-Rust retry logic, functional
    "RUSTSEC-2025-0012",
    # bincode: syntect's packed syntax dumps (adk-surface)
    "RUSTSEC-2025-0141",
    # fxhash: Non-crypto hash for BM25 tables
    "RUSTSEC-2025-0057",
    # instant: Time shim, delegates to std::time on native
    "RUSTSEC-2024-0384",
    # number_prefix: Formatting utility for progress bars
    "RUSTSEC-2025-0119",
    # paste: Compile-time macro, no runtime behavior
    "RUSTSEC-2024-0436",
    # rustls-pemfile: Superseded by built-in rustls PEM parser
    "RUSTSEC-2025-0134",
]
