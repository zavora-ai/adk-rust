# =============================================================================
# cargo-audit configuration
# =============================================================================
# Advisories listed here have been reviewed and accepted per the risk
# assessment documented in docs/security/DEPENDENCY-ADVISORIES.md.
#
# Run `cargo audit` locally or in CI — these IDs will be skipped while
# new, unreviewed advisories still surface as failures.
#
# This list is wider than deny.toml's: cargo-audit scans the lockfile, so it
# also reports crates that no resolved feature graph reaches (rkyv 0.7) and
# transitive unmaintained crates that cargo-deny's `unmaintained = "workspace"`
# policy deliberately leaves to upstream.

[advisories]
ignore = [
    # quick-xml 0.26: memory-exhaustion and quadratic-parse DoS. Reached only as
    # lancedb -> lance-testing -> pprof -> inferno, behind the optional
    # `adk-rag/lancedb` feature; lancedb declares `lance-testing` as a normal
    # dependency so the path cannot be dropped downstream. Crates this workspace
    # declares directly are on the patched line (adk-eval requires 0.41), and
    # deny.toml bans quick-xml < 0.41 outside the inferno path.
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",

    # zip < 9: SUID/SGID bits kept, symlink targets and permissions applied
    # outside the destination — all three in `ZipArchive::extract` and
    # `ZipStreamReader::extract`. Crates this workspace declares require zip 9
    # (adk-skill, adk-cli), and deny.toml bans zip < 9 outside the wrappers below.
    # No release of any wrapper depends on zip >= 9.
    #   * zip 0.6.6: adk-realtime -> webrtc-sys 0.3.40 -> (build) webrtc-sys-build
    #     0.3.18, feature `adk-realtime/livekit`. Its build script calls `extract`
    #     at build time on LiveKit's pinned libwebrtc archive (HTTPS, GitHub
    #     release `webrtc-51ef663`); no runtime path, and no input adk controls.
    #     `LK_CUSTOM_WEBRTC` skips the download and the extraction.
    #   * zip 6.0.0: adk-audio -> ndarray-npy 0.10.0 (`npz`), feature
    #     `adk-audio/kokoro`. `NpzReader` reads entries by name; never extracts.
    #   * zip 7.2.0: adk-audio -> candle-core 0.9.2 (also via qwen_tts 0.1.1),
    #     feature `adk-audio/qwen3-tts`; adk-mistralrs -> mistralrs 0.8.1 ->
    #     candle-core 0.10.2. candle reads `.npz`/`.pth` entries by name and
    #     writes `.npz`; never extracts.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # rkyv 0.7 is present only as rust_decimal's disabled optional `rkyv`
    # feature. No workspace feature activates it; active archive consumers use
    # rkyv 0.8.18. See the security advisory review.
    "RUSTSEC-2026-0235",

    # rsa: Marvin timing side-channel (no upstream fix, accepted risk)
    "RUSTSEC-2023-0071",

    # --- Unmaintained crates (no security impact) ---

    # async-std: Discontinued runtime, transitive shim only
    "RUSTSEC-2025-0052",
    # atomic-polyfill: Polyfill for non-std targets, ADK uses std only
    "RUSTSEC-2023-0089",
    # audiopus_sys: Unmaintained opus FFI bindings
    "RUSTSEC-2026-0150",
    # backoff: Pure-Rust retry logic, functional
    "RUSTSEC-2025-0012",
    # bincode: Internal to SurrealDB
    "RUSTSEC-2025-0141",
    # fxhash: Non-crypto hash for BM25 tables
    "RUSTSEC-2025-0057",
    # instant: Time shim, delegates to std::time on native
    "RUSTSEC-2024-0384",
    # number_prefix: Formatting utility for progress bars
    "RUSTSEC-2025-0119",
    # paste: Compile-time macro, no runtime behavior
    "RUSTSEC-2024-0436",
    # rustls-pemfile: Superseded by built-in rustls PEM parser
    "RUSTSEC-2025-0134",
]
