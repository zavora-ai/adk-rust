[package]
name = "adk-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line launcher for Rust Agent Development Kit (ADK-Rust) agents"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-cli"
keywords = ["ai", "agent", "adk", "cli", "launcher"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "adk_cli"
path = "src/lib.rs"

[[bin]]
name = "adk-rust"
path = "src/main.rs"

[dependencies]
adk-core.workspace = true
adk-auth = { workspace = true, features = ["signed-audit"], optional = true }
adk-agent = { workspace = true, features = ["coding"] }
adk-devtools.workspace = true
adk-model.workspace = true
adk-runner = { workspace = true, features = ["artifacts", "plugins"] }
# Serve mode mounts the approval inbox and background runs (spec 3.1 §8.2)
adk-server = { workspace = true, features = ["approvals", "background"] }
adk-session.workspace = true
adk-artifact.workspace = true
adk-tool.workspace = true
adk-telemetry.workspace = true
adk-skill.workspace = true
adk-deploy.workspace = true
adk-graph = { workspace = true, features = ["time-travel"] }
# The harness REPL, `code`, `goal`, `ultracode` and `serve` (spec 3.1 §8.1)
adk-harness = { workspace = true, optional = true }
adk-browser = { workspace = true, optional = true }
# `--provider mistralrs`: local inference in process (spec 3.1 §8.1); a heavy build
adk-mistralrs = { workspace = true, optional = true }
# `adk-rust approvals --server` talks to a served harness's approval inbox
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# `adk-rust store status|rotate-key` reads harness.db's tables directly
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "sqlite"] }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { version = "4.6", features = ["derive"] }
rustyline = "18.0"
tokio = { workspace = true, features = ["full"] }
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
axum = "0.8"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
serde_json.workspace = true
serde.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "7"
toml.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[features]
default = ["gemini", "openai", "anthropic", "ollama", "audit", "persist", "harness", "encrypted", "memory-local"]
gemini = ["adk-model/gemini"]
openai = ["adk-model/openai"]
anthropic = ["adk-model/anthropic"]
deepseek = ["adk-model/deepseek"]
groq = ["adk-model/groq"]
ollama = ["adk-model/ollama"]
# `--provider mistralrs --model <hf id or .gguf path>`: mistral.rs in process (spec 3.1
# §8.1). Opt-in: mistral.rs 0.8 with its model loaders is a heavy build; GPU through
# adk-mistralrs's `cuda` or `metal`.
mistralrs = ["dep:adk-mistralrs"]
all-providers = ["gemini", "openai", "anthropic", "deepseek", "groq", "ollama"]
# `adk-rust deploy agent-engine`: deploy a BYOC container as a Gemini
# Enterprise Agent Platform engine (host-side tooling)
gcp-deploy = ["adk-deploy/gcp"]
# `adk-rust registry ...`: register self-hosted agents, external MCP servers,
# and bare endpoints in the Google Agent Registry (host-side tooling)
vertex-agent-registry = ["adk-tool/vertex-agent-registry"]
telemetry-otlp = ["adk-telemetry/otlp"]
# Prompt optimization CLI command (adk optimize)
optimize = []
# `adk-rust skills search` / `skills pull`: read-only Vertex AI Skill
# Registry commands (lifecycle stays with platform tooling)
vertex-skill-registry = ["adk-skill/vertex-skill-registry"]
# SQLite checkpointer for graph time-travel commands
graph-sqlite = ["adk-graph/sqlite"]
# `adk-rust audit verify` and `audit keygen` for signed audit logs (links aws-lc-rs)
audit = ["dep:adk-auth"]
# `adk-rust audit export`: read signed audit logs from SQLite or PostgreSQL
audit-sql = ["audit", "adk-session/sqlite", "adk-session/postgres"]
# Sessions, approvals, durable runs, modes and standing rules in SQLite at
# <config dir>/adk-rust/harness.db
persist = ["adk-session/sqlite", "adk-harness?/sqlite"]
# `adk-rust` with no subcommand is the harness REPL; `code`, `goal`, `ultracode` and
# `serve` run on the harness; `sessions`, `rules` and `approvals` manage it (spec 3.1 §8.1)
harness = ["dep:adk-harness", "adk-harness?/memory-embeddings", "adk-harness?/web", "adk-harness?/mcp", "adk-harness?/hooks", "dep:reqwest", "dep:sha2", "dep:uuid", "dep:chrono"]
# `--store-key`, `[store] key`, `adk-rust store status|rotate-key`: harness.db sealed under
# one keyring from the OS keychain, a secret provider or the environment (spec 3.1 §7.12)
encrypted = ["adk-harness?/encrypted", "adk-session/encrypted-session", "dep:sqlx"]
# `--pack browser` and `--pack computer-use` (spec 3.1 §7.24): the browser pack over the
# WebDriver at ADK_WEBDRIVER_URL (default http://localhost:4444); the computer-use pack is
# library-only, so its feature compiles the classes for a harness built in code.
browser = ["harness", "adk-harness/browser", "dep:adk-browser"]
computer-use = ["harness", "adk-harness/computer-use"]
# The in-process ONNX embedder for long-term memory, the default of a local provider
# (spec 3.1 §7.15.2, H10); `ort` downloads the onnxruntime binary at build time
memory-local = ["adk-harness?/memory-embeddings-local"]
# `--store-key secret:<provider>/<name>` through adk-auth's secret providers
secrets-gcp = ["dep:adk-auth", "adk-auth/gcp-secrets"]
secrets-aws = ["dep:adk-auth", "adk-auth/aws-secrets"]
# Hidden `--model-script` and `--approval-fixture` flags for binary end-to-end tests:
# a scripted model and a tool that needs approval, no provider key required
scripted-model = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
google-cloud-auth = { version = "1.8", default-features = false, features = ["default-rustls-provider"] }
tempfile = "3"
zip = { workspace = true }
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(unix)'.dev-dependencies]
# openpty for the console end-to-end tests, which drive the binary in a pseudo-terminal
libc = "0.2"
