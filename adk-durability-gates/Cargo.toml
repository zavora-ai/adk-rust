[package]
name = "adk-durability-gates"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Multi-process durability gates for the durable runtime on every durable backend — not published"

# Nothing is compiled without a backend feature, so the default workspace build stays
# as it was (the harness needs `adk-server/background`). The SQLite gates run on every
# pull request through feature-coverage shard 2; the server gates are `#[ignore]`d and
# run in the nightly `durable-stores` job with `all-backends`.
[features]
default = []
# The harness, the gate process, and the gates; every backend feature enables it.
gates = ["dep:adk-agent", "dep:adk-core", "dep:adk-runner", "dep:adk-server", "dep:adk-session"]
sqlite = ["gates", "adk-session/sqlite"]
postgres = ["gates", "adk-session/postgres"]
redis = ["gates", "adk-session/redis"]
mongodb = ["gates", "adk-session/mongodb"]
neo4j = ["gates", "adk-session/neo4j"]
firestore = ["gates", "adk-session/firestore"]
all-backends = ["sqlite", "postgres", "redis", "mongodb", "neo4j", "firestore"]

[dependencies]
# Path-only: this crate is never published, so it must not constrain the publish order.
adk-agent = { path = "../adk-agent", optional = true }
adk-core = { path = "../adk-core", features = ["cron"], optional = true }
adk-runner = { path = "../adk-runner", optional = true }
adk-server = { path = "../adk-server", features = ["background"], optional = true }
adk-session = { path = "../adk-session", optional = true }
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[[bin]]
name = "adk-durability-gate"
path = "src/bin/adk-durability-gate.rs"
required-features = ["gates"]

[[test]]
name = "gates"
path = "tests/gates.rs"
required-features = ["gates"]

[dev-dependencies]
tempfile = "3"
