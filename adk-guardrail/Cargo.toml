[package]
name = "adk-guardrail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-guardrail"
readme = "README.md"
exclude = ["tests/"]
description = "Guardrails for ADK-Rust agents: input, output, and tool-call validation, content filtering, PII redaction"
keywords = ["ai", "agents", "guardrails", "safety", "validation"]
categories = ["development-tools", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
adk-core.workspace = true
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }

# Optional: JSON Schema validation
jsonschema = { workspace = true, optional = true }

# Optional: Google Cloud Model Armor
adk-gcp = { workspace = true, optional = true }
google-cloud-auth = { version = "1.8", optional = true, default-features = false, features = ["default-rustls-provider"] }
reqwest = { workspace = true, optional = true }

[features]
default = ["schema"]
schema = ["dep:jsonschema"]
# Model Armor guardrails for user input, model output, and tool results
model-armor = ["dep:adk-gcp", "dep:google-cloud-auth", "dep:reqwest"]

[dev-dependencies]
tempfile = "3"
# Mock Model Armor endpoint for the contract tests.
wiremock = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true }
