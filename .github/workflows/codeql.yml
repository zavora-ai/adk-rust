name: CodeQL

# Code scanning runs on pushes to main and weekly, not on every pull request push.
# A Rust analysis occupies a runner for about an hour, and the account's
# concurrent-job limit is shared with the PR tier, so per-push scans starved the
# merge-blocking checks. This workflow replaces GitHub's default setup.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config-file: ./.github/codeql/config.yml

    - name: Analyze
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        category: "/language:${{ matrix.language }}"
