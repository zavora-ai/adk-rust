name: Model catalog freshness

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check documented provider defaults
        run: bash scripts/check-model-catalog-freshness.sh
      - name: Check encoded per-token rates
        run: bash scripts/check-model-pricing.sh
