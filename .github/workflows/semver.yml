name: Semver Checks

on:
  pull_request:
    branches: [ main ]
  # The merge queue creates a synthetic merge-group ref and requires this
  # check to be reported for that ref before it can advance.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The kind of release the next publish will be. `major` while the workspace is
  # the 3.0.0 release candidate; the first pull request after 3.0.0 is published
  # sets it back to `minor`. `scripts/validate-pr.sh` reads this value.
  SEMVER_RELEASE_TYPE: major

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    # Toolchain install + wild linker strip + build cache, from the shared action.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: semver
        cache-save: 'false'

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
      with:
        tool: cargo-semver-checks

    # Stable-tier leaf crates only (skip adk-rust umbrella — it just re-exports).
    # `--release-type` states the kind of release the next publish will be: with
    # `minor`, additive API changes pass and breaking ones fail; with `major`, every
    # change passes and the `breaking` changelog fragments record the breaking-change
    # inventory, as for 2.0.0 (STABILITY.md). Without the flag, cargo-semver-checks
    # compares the version numbers and fails every addition until the workspace
    # version is bumped, which forced a release-candidate bump before any new API
    # could merge. The bump happens in the release preparation pull request.
    - name: Semver checks — Stable crates (strict)
      run: |
        echo "### Stable-tier crates (fail on breakage)" >> "$GITHUB_STEP_SUMMARY"
        FAILED=0
        for crate in adk-core adk-agent adk-model adk-gemini adk-tool adk-runner adk-session adk-server adk-graph adk-memory adk-anthropic; do
          echo "Checking $crate..."
          if cargo semver-checks check-release -p "$crate" --default-features --release-type "$SEMVER_RELEASE_TYPE"; then
            echo "✅ $crate" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ $crate — BREAKING" >> "$GITHUB_STEP_SUMMARY"
            FAILED=1
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          echo "::error::Semver breakage detected in Stable-tier crates"
          exit 1
        fi

    # Every other published crate. Warn-only because these tiers do not carry the
    # Stable API commitment (see STABILITY.md).
    #
    # Absent on purpose: `adk-computer-use`, `adk-devtools`, and `adk-codeact-monty`
    # are new (unpublished before 2.0.0) and have no published baseline to diff
    # against, and `adk-rust-macros` exposes no library target for
    # cargo-semver-checks to read. Add the first three here once 2.0.0 is on
    # crates.io.
    - name: Semver checks — Beta/Experimental (warn only)
      run: |
        echo "### Beta/Experimental crates (warn only)" >> "$GITHUB_STEP_SUMMARY"
        for crate in adk-artifact adk-auth \
          adk-telemetry adk-guardrail adk-plugin adk-skill \
          adk-cli adk-realtime adk-browser adk-eval adk-audio \
          adk-acp adk-awp awp-types adk-action adk-code adk-deploy \
          adk-managed adk-enterprise adk-payments adk-rag adk-sandbox \
          adk-retry-reflect adk-mistralrs adk-bench cargo-adk; do
          echo "Checking $crate..."
          if cargo semver-checks check-release -p "$crate" --default-features --release-type "$SEMVER_RELEASE_TYPE"; then
            echo "✅ $crate" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ $crate — breaking (warn)" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
