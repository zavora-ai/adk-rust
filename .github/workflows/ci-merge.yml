name: CI Merge

# Merge tier: runs after a change lands on main, carrying the coverage kept off the
# pull request path — the full macOS and Windows suites, the kernel scenarios on macOS,
# the documented-example check and the computer-use receipt.
#
# `gh workflow run ci-merge.yml --ref <branch>` runs the same jobs on a branch before it
# merges. Only `main` saves build caches.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  PROTOC: protoc
  # Matches ci.yml: the build caches are keyed on these variables, so the pull request's
  # macOS and Windows jobs restore what this workflow saves.
  CARGO_PROFILE_DEV_DEBUG: "0"

# Merge-tier runs are the cross-platform safety net for changes already on main;
# they should complete rather than be superseded, so in-progress runs are not
# cancelled (unlike the PR tier).
concurrency:
  group: ci-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Cross-platform: full macOS + Windows test suite ────────────
  # Linux runs the full suite on every pull request (ci.yml `test`).
  cross-platform-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        # The pull request's macOS and Windows jobs restore this cache by the same keys.
        cache-key: cross-platform-test-${{ matrix.os }}
        cache-shared-key: cross-platform-test

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake protobuf

    - name: Install cmake (Windows)
      if: runner.os == 'Windows'
      uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4

    - name: Install protoc (Windows)
      if: runner.os == 'Windows'
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest

    - name: Run tests
      run: cargo nextest run --workspace --profile ci --no-fail-fast

  # ── Agent kernel: the example's scripted scenarios on macOS ────
  # spec 3.2 §11: the scripted scenarios run on macOS and Linux CI; Linux runs them on
  # every pull request (ci.yml `kernel-scenarios`).
  kernel-scenarios-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        enable-cache: 'false'

    - name: Run the kernel example's scripted scenarios
      timeout-minutes: 40
      run: cargo run --locked --manifest-path examples/harness_kernel/Cargo.toml

  # ── Doc examples: documented snippets match the workspace ───────
  # Cargo snippets, feature names and package/example references in README.md and
  # docs/official_docs/ against `cargo metadata`; nothing is compiled.
  doc-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'

    - name: Validate documented examples
      run: bash scripts/check-doc-examples.sh

  # ── Computer-use receipt ───────────────────────────────────────
  # The ADK evaluation receipt computer-use-mcp v8 consumes, from adk-computer-use's tests
  # on the commit that landed.
  computer-use-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'

    - name: Install system dependencies
      timeout-minutes: 10
      uses: ./.github/actions/apt-install
      with:
        packages: protobuf-compiler libdbus-1-dev

    - name: Generate the receipt
      run: node scripts/generate-computer-use-v8-evidence.mjs --subject-version "${COMPUTER_USE_MCP_V8_VERSION}" --output adk-computer-use-v8-evidence.json --compact
      env:
        COMPUTER_USE_MCP_V8_VERSION: "7.0.0"

    - name: Upload the receipt
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: adk-computer-use-v8-evidence
        path: adk-computer-use-v8-evidence.json
        if-no-files-found: error
