name: CI

# PR tier only. Post-merge coverage belongs to ci-merge.yml; running this full
# workflow on main duplicated every PR job after each merge.
on:
  pull_request:
    branches: [ main ]
  # Required checks must also run against GitHub's synthetic merge-group ref
  # when a pull request enters the merge queue.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  PROTOC: protoc

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate: formatting (< 30s) ──────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # ws-fmt is exactly `cargo fmt --all`; use the shared pinned toolchain
    # directly instead of spending ~3 minutes bootstrapping Nix + devenv.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        components: rustfmt
        enable-cache: 'false'

    - name: Check formatting
      run: cargo fmt --all -- --check

  # ── Scope: what can this change affect? ───────────────────────
  # A change under docs/ or to Markdown cannot alter a Rust build, so the Rust jobs
  # skip and `pr-gate` accepts the skip. Anything else, or any doubt (an API failure,
  # a truncated file list), runs the full tier. Merge-queue builds compare the group
  # head against main, so a group that only carries docs is scoped the same way.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
    - name: Classify the changed files
      id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BASE: ${{ github.event.merge_group.base_sha }}
        HEAD: ${{ github.event.merge_group.head_sha }}
      run: |
        set -euo pipefail
        docs_only=false
        files=""
        case "$EVENT" in
          pull_request)
            files="$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[].filename')" || files="" ;;
          merge_group)
            # The compare API lists at most 300 files; past that the list is truncated and
            # cannot prove a docs-only group, so the run stays full.
            files="$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq 'if (.files | length) >= 300 then "truncated" else .files[].filename end')" || files="" ;;
        esac
        if [[ -n "$files" ]] && ! grep -vqE '^(docs/|LICENSE|[^ ]*\.md$)' <<<"$files"; then
          docs_only=true
        fi
        echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
        printf 'docs_only=%s (%s files)\n' "$docs_only" "$(grep -c . <<<"$files" || true)"

  # ── Built-in runtime UI: source, tests, and embedded build ─────
  webui:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: adk-server/webui/package-lock.json

    - name: Verify runtime UI
      working-directory: adk-server/webui
      run: |
        npm ci
        npm run verify

    - name: Require generated assets to match source
      run: git diff --exit-code -- adk-server/assets/webui

  # ── Lint: clippy (parallel with test) ──────────────────────────
  clippy:
    needs: [fmt, scope]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet

    - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv


    - name: Run clippy
      shell: bash
      run: CI=true devenv shell ws-clippy --message-format=json | tee clippy.json

    - name: Annotate clippy warnings
      if: always()
      run: |
        if [ -f clippy.json ]; then
          ERRORS=$(grep -c '"level":"error"' clippy.json || echo 0)
          WARNINGS=$(grep -c '"level":"warning"' clippy.json || echo 0)
          echo "### 🔍 Clippy: ${ERRORS} errors, ${WARNINGS} warnings" >> "$GITHUB_STEP_SUMMARY"
        fi

  # ── Test: nextest (parallel with clippy) ───────────────────────
  test:
    needs: [fmt, scope]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet

    - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Run tests
      shell: bash
      run: CI=true devenv shell ws-test-ci 2>&1 | tee test.log

    - name: Generate computer-use v8 ADK evaluation receipt
      run: CI=true devenv shell node scripts/generate-computer-use-v8-evidence.mjs --subject-version "${COMPUTER_USE_MCP_V8_VERSION}" --output adk-computer-use-v8-evidence.json --compact
      env:
        COMPUTER_USE_MCP_V8_VERSION: "7.0.0"

    - name: Upload computer-use v8 ADK evaluation receipt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: adk-computer-use-v8-evidence
        path: adk-computer-use-v8-evidence.json
        if-no-files-found: error

    - name: Test summary
      if: always()
      run: |
        if [ -f test.log ] && grep -q "tests run:" test.log; then
          SUMMARY=$(grep "tests run:" test.log | tail -1)
          echo "### 🧪 $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi

  # ── Feature coverage: feature-gated modules default CI skips ───
  # Default clippy/test builds never compile feature-gated modules (e.g.
  # `adk-agent`'s `codeact`), so a regression there is invisible on the normal
  # PR path. scripts/feature-coverage-pairs.txt names every such package/feature
  # pair and the shard that covers it; each shard compiles and tests its pairs on
  # one runner with one target directory, so shared dependencies build once
  # instead of once per pair. One job per pair (48 of them) used to need 48
  # toolchain installs and 48 apt runs and could not fit the account's
  # concurrent-job limit alongside the rest of the tier.
  #
  # To cover another feature-gated module, add ONE line to the pairs file.
  feature-coverage:
    name: feature-coverage (${{ matrix.shard }}/7)
    needs: [fmt, scope]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Toolchain (with clippy) + wild-linker strip + build cache from the shared
    # action. neutralize-wild defaults to true, correct for this plain runner.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        components: clippy
        cache-key: feature-coverage-${{ matrix.shard }}
        cache-save: 'false'

    # protoc for lancedb's build script, libdbus for adk-cli's keyring dependency,
    # cmake and the ALSA/udev headers for the audio and realtime pairs. One apt run
    # per shard replaces the per-pair protoc action that hit the GitHub API rate
    # limit under fan-out.
    - name: Install system dependencies
      # A stalled apt mirror once held jobs for the full six-hour limit; bound the step and let apt retry.
      timeout-minutes: 10
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 install -y cmake protobuf-compiler libdbus-1-dev libasound2-dev libudev-dev

    - name: Install cargo-nextest
      uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
      with:
        tool: cargo-nextest

    - name: Clippy and test the shard's pairs
      run: bash scripts/check-feature-coverage.sh ${{ matrix.shard }}

  # ── Docs: documentation coverage for Stable-tier crates ──────
  docs:
    needs: [fmt, scope]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Documentation needs the pinned Rust toolchain, not the full devenv
    # shell. Running directly avoids Nix bootstrap latency and transient
    # invalid-store-path failures while retaining the workspace build cache.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: pr-docs
        cache-save: 'false'

    # adk-cli's keyring dependency links libdbus on Linux even when rustdoc is
    # only documenting the workspace's default feature sets.
    - name: Install documentation system dependencies
      # A stalled apt mirror once held jobs for the full six-hour limit; bound the step and let apt retry.
      timeout-minutes: 10
      run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 install -y libdbus-1-dev

    - name: Check documentation coverage
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: |
        echo "### 📚 Documentation Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if cargo doc --workspace --no-deps; then
          echo "✅ Workspace documentation built with no warnings" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ Workspace documentation build failed (missing or broken docs)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Documentation coverage check failed"
          exit 1
        fi

    # Doctests: nextest cannot run them, so `ws-test` never touches a single doc
    # example. Without this step a documented snippet can stop compiling and no
    # job notices — that is how five broken examples reached the 2.0.0 review in
    # `adk-rust`'s crate-level docs.
    #
    # `adk-rust` is excluded from the workspace pass and run separately under
    # `full`: its crate-level docs cover the whole API surface, so the examples
    # only resolve when the optional modules they reference are compiled in. That
    # matches the feature set docs.rs renders (see adk-rust's
    # [package.metadata.docs.rs]).
    - name: Run doctests
      run: |
        cargo test --workspace --doc --exclude adk-rust
        cargo test -p adk-rust --features full --doc

    - name: Doctest summary
      if: always()
      run: echo "### 🧪 doctests (workspace + adk-rust --features full) completed" >> "$GITHUB_STEP_SUMMARY"

  # ── Standalone examples: compile every examples/* crate ────────
  # The standalone examples are separate workspaces, so the workspace build does
  # not catch public-API breakage or stale example lockfiles. Run the four
  # shards before merge; each shard shares one target directory across its
  # examples to avoid rebuilding common ADK crates.
  examples-compile:
    name: examples-compile (${{ matrix.shard }}/4)
    needs: [fmt, scope]
    if: needs.scope.outputs.docs_only != 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: pr-examples-compile-${{ matrix.shard }}
        cache-save: 'false'

    - name: Install system dependencies
      # A stalled apt mirror once held jobs for the full six-hour limit; bound the step and let apt retry.
      timeout-minutes: 10
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 install -y cmake protobuf-compiler libdbus-1-dev libasound2-dev libudev-dev

    - name: Compile standalone examples (shard ${{ matrix.shard }} of 4)
      run: bash scripts/check-examples-compile.sh ${{ matrix.shard }} 4

    - name: Examples summary
      if: always()
      shell: bash
      run: echo "### 📦 standalone example compile, shard ${{ matrix.shard }} of 4" >> "$GITHUB_STEP_SUMMARY"

  # ── Scaffolds: cargo-adk generated projects compile ────────────
  templates:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: pr-templates
        cache-save: 'false'

    - name: Install system dependencies
      # A stalled apt mirror once held jobs for the full six-hour limit; bound the step and let apt retry.
      timeout-minutes: 10
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300 install -y cmake protobuf-compiler libdbus-1-dev libasound2-dev libudev-dev

    - name: Check cargo-adk templates
      run: |
        bash scripts/check-example-name-collisions.sh
        bash scripts/check-doc-examples.sh
        # Doc rot guard: dependency-snippet versions in docs/READMEs/lib.rs must
        # match the workspace version, and every adk-rust feature named in docs
        # must exist in adk-rust/Cargo.toml (catches stale "0.8.2" snippets and
        # phantom features like the removed `labs`).
        bash scripts/check-doc-versions.sh
        # Release-statement guard: the changelog heading, README banner, and
        # roadmap "current" marker are all derived from one source — the
        # workspace version — so a bump cannot land with any of them stale.
        # check-doc-versions.sh skips CHANGELOG.md and never looked at the
        # banner or roadmap, which is how those three drifted apart.
        bash scripts/check-release-consistency.sh
        # Publish-order guard: publish.sh tiers must satisfy the workspace
        # dependency graph, including versioned dev-deps (what broke v1.0.0).
        bash scripts/check-publish-order.sh
        # Scaffold every advertised template — including addon combos and
        # default-provider resolution — and cargo-check the generated projects.
        bash scripts/check-cargo-adk-templates.sh

  # ── Cross-platform: macOS compile-only build ───────────────────
  # PR tier is compile-only; the full nextest run moves to the merge tier
  # (ci-merge.yml). setup-rust supplies the toolchain + build cache;
  # neutralize-wild is false because the wild-linker strip is Linux-only.
  macos:
    needs: [fmt, scope]
    if: needs.scope.outputs.docs_only != 'true' && github.event_name != 'merge_group'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        cache-key: cross-platform-test-macos-latest
        cache-shared-key: cross-platform-test
        cache-save: 'false'

    - name: Install system dependencies
      run: brew install cmake protobuf

    - name: Build workspace
      run: cargo build --workspace

    - name: Build summary
      if: always()
      run: echo "### 🍎 macOS compile-only build passed" >> "$GITHUB_STEP_SUMMARY"

  # ── Cross-platform: Windows build + portability smoke ──────────
  # The full nextest run stays in the merge tier (ci-merge.yml). The focused
  # output-cap suite runs here because its process scripts are platform-specific
  # and must fail before merge when they stop working on Windows.
  windows:
    needs: [fmt, scope]
    if: needs.scope.outputs.docs_only != 'true' && github.event_name != 'merge_group'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        cache-key: cross-platform-test-windows-latest
        cache-shared-key: cross-platform-test
        cache-save: 'false'

    - name: Install cmake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

    - name: Install protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build workspace
      run: cargo build --workspace

    - name: Run sandbox output-cap portability smoke
      run: cargo test -p adk-sandbox --test output_cap_tests

    - name: Run sandbox Rust compilation portability smoke
      run: cargo test -p adk-sandbox --test process_enforcement_tests a_working_program_still_runs -- --exact

    - name: Build summary
      if: always()
      run: echo "### 🪟 Windows build and sandbox portability smoke passed" >> $env:GITHUB_STEP_SUMMARY

  # ── Stable branch-protection contract ──────────────────────────────────
  # Shards and matrix entries remain individually visible for diagnosis, while
  # branch protection only needs this stable aggregate context (plus `semver`).
  # A skipped job passes the gate only when `scope` or the event skipped it:
  # docs-only changes skip every Rust job, and merge-queue builds skip the
  # standalone-example shards and the macOS/Windows builds, which the pull
  # request already passed.
  pr-gate:
    name: pr-gate
    if: always()
    needs:
      - scope
      - fmt
      - webui
      - clippy
      - test
      - feature-coverage
      - docs
      - examples-compile
      - templates
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Require every PR-tier job to pass or be scoped out
      shell: bash
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
        EVENT: ${{ github.event_name }}
      run: |
        skippable=""
        if [[ "$DOCS_ONLY" == "true" ]]; then
          skippable="clippy test feature-coverage docs examples-compile macos windows"
        fi
        if [[ "$EVENT" == "merge_group" ]]; then
          skippable="$skippable examples-compile macos windows"
        fi
        failed_jobs="$(jq -r --arg skippable "$skippable" '
          ($skippable | split(" ") | map(select(. != ""))) as $ok
          | to_entries[]
          | select(.value.result != "success")
          | .key as $job
          | select((.value.result == "skipped" and ($ok | index($job) != null)) | not)
          | "\($job)=\(.value.result)"' <<<"$JOB_RESULTS")"
        if [[ -n "$failed_jobs" ]]; then
          echo "::error::PR tier did not pass:"
          echo "$failed_jobs"
          exit 1
        fi
        echo "All PR-tier jobs passed (skippable: ${skippable:-none})."
