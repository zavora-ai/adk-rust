name: CI

# PR tier only. Post-merge coverage belongs to ci-merge.yml; running this full
# workflow on main duplicated every PR job after each merge.
on:
  pull_request:
    branches: [ main ]
  # Required checks must also run against GitHub's synthetic merge-group ref
  # when a pull request enters the merge queue.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  PROTOC: protoc

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate: formatting (< 30s) ──────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # ws-fmt is exactly `cargo fmt --all`; use the shared pinned toolchain
    # directly instead of spending ~3 minutes bootstrapping Nix + devenv.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        components: rustfmt
        enable-cache: 'false'

    - name: Check formatting
      run: cargo fmt --all -- --check

  # ── Built-in runtime UI: source, tests, and embedded build ─────
  webui:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: adk-server/webui/package-lock.json

    - name: Verify runtime UI
      working-directory: adk-server/webui
      run: |
        npm ci
        npm run verify

    - name: Require generated assets to match source
      run: git diff --exit-code -- adk-server/assets/webui

  # ── Lint: clippy (parallel with test) ──────────────────────────
  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet

    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv


    - name: Run clippy
      run: CI=true devenv shell ws-clippy --message-format=json | tee clippy.json

    - name: Annotate clippy warnings
      if: always()
      run: |
        if [ -f clippy.json ]; then
          ERRORS=$(grep -c '"level":"error"' clippy.json || echo 0)
          WARNINGS=$(grep -c '"level":"warning"' clippy.json || echo 0)
          echo "### 🔍 Clippy: ${ERRORS} errors, ${WARNINGS} warnings" >> "$GITHUB_STEP_SUMMARY"
        fi

  # ── Test: nextest (parallel with clippy) ───────────────────────
  test:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet

    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Run tests
      run: CI=true devenv shell ws-test-ci | tee test.log

    - name: Generate computer-use v8 ADK evaluation receipt
      run: CI=true devenv shell node scripts/generate-computer-use-v8-evidence.mjs --subject-version "${COMPUTER_USE_MCP_V8_VERSION}" --output adk-computer-use-v8-evidence.json --compact
      env:
        COMPUTER_USE_MCP_V8_VERSION: "7.0.0"

    - name: Upload computer-use v8 ADK evaluation receipt
      uses: actions/upload-artifact@v7
      with:
        name: adk-computer-use-v8-evidence
        path: adk-computer-use-v8-evidence.json
        if-no-files-found: error

    - name: Test summary
      if: always()
      run: |
        if [ -f test.log ] && grep -q "tests run:" test.log; then
          SUMMARY=$(grep "tests run:" test.log | tail -1)
          echo "### 🧪 $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi

  # ── Feature coverage: feature-gated modules default CI skips ───
  # Default clippy/test builds never compile feature-gated modules (e.g.
  # `adk-agent`'s `codeact`), so a regression there is invisible on the normal
  # PR path. This job compiles + tests each such module under its feature on a
  # plain runner via the shared setup-rust action (components + wild-linker
  # strip + cache come from there — no per-job setup drift).
  #
  # System build deps needed by any matrix entry (currently just protoc, for
  # `adk-rag --features lancedb`) are installed unconditionally below, so the
  # "add ONE line" invariant holds without touching the steps.
  #
  # `adk-rag --features lancedb` is the slowest entry — it pulls the whole
  # lance/datafusion tree. It lives in the PR tier on purpose: an arrow version
  # mismatch sat broken on main for weeks because nothing in CI compiled the
  # LanceDB backend, and nightly would let the next bad bump land on main first.
  #
  # To cover another feature-gated module, add ONE line to the matrix below:
  #   - { package: <crate>, features: <feature> }
  feature-coverage:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: adk-agent, features: codeact }
          # Guardrails are not in adk-agent's default features, so `--workspace` never compiled
          # the adk-guardrail integration and `tool_guardrail_tests` ran in no required check.
          - { package: adk-agent, features: guardrails }
          - { package: adk-model, features: openrouter }
          - { package: adk-sandbox, features: wasm }
          # The background run store and its persistence are behind `background`, so a
          # default --workspace build skips their tests entirely. Nothing compiled them
          # when durable run records were added.
          - { package: adk-server, features: background }
          # The Agent Engine dispatch surface (Gemini Enterprise Agent Platform runtime
          # contract) is behind `agent-engine`; its wire-fixture and dispatch tests only
          # run with the feature on. Umbrella forwarding follows in the entrypoint PR.
          - { package: adk-server, features: agent-engine }
          # The Memory Bank backend (vertex-memory) is opt-in; its mock contract tests
          # only run with the feature on.
          - { package: adk-memory, features: vertex-memory }
          # The Agent Engine deployment client (gcp) is opt-in; its golden DTO and
          # mock contract tests only run with the feature on.
          - { package: adk-deploy, features: gcp }
          # The `deploy agent-engine` CLI subcommand is behind gcp-deploy; its
          # arg-parse and mock create-contract tests only run with the feature on.
          - { package: adk-cli, features: gcp-deploy }
          # sandbox-linux is Linux-only *and* feature-gated, so nothing built it until a
          # container run found the bubblewrap probe could never succeed and that its
          # property tests did not compile.
          - { package: adk-sandbox, features: sandbox-linux }
          # ambient and integration carry the webhook trigger, the ambient loop, and the
          # realtime integration layer. Two individually-green PRs broke the ambient build
          # in combination because no job compiled it.
          - { package: adk-agent, features: ambient }
          - { package: adk-realtime, features: integration }
          # The OpenAI realtime session and its WebSocket transport are gated behind
          # `openai`, which is not in adk-realtime's default features, so `--workspace`
          # never compiled them and no job ever *ran* their tests. The nightly `full`
          # clippy build compiles them but executes nothing.
          - { package: adk-realtime, features: openai }
          # Two entries on purpose. `memory` alone looked like coverage while leaving
          # `sandbox` unbuilt: adk-sandbox renamed a field of EnforcedLimits in #485 and
          # a call site behind `sandbox` kept the old name for two releases, because
          # nothing compiled it. `full` is sandbox + memory and closes that.
          #
          # `memory` stays because branch protection requires the check by its rendered
          # name, `feature-coverage (adk-managed, memory)`. Removing the entry leaves
          # that requirement waiting for a status no job will ever report, which blocks
          # every PR. Drop it only together with the branch-protection entry.
          - { package: adk-managed, features: memory }
          - { package: adk-managed, features: full }
          - { package: adk-audio, features: fx }
          - { package: adk-rag, features: lancedb }
          # adk-rag's SurrealDB backend: gated behind `surrealdb`, so `--workspace` builds
          # never compiled it. A surrealdb 3.2 parser change broke create_collection while
          # every required check stayed green. Tests run on the embedded kv-mem engine.
          - { package: adk-rag, features: surrealdb }
          # adk-auth's SSO/OAuth surface: gated behind `sso`, so `--workspace` without
          # feature flags never compiled it. It had drifted out of the clippy gate, and a
          # jsonwebtoken major bump broke it while every required check stayed green.
          - { package: adk-auth, features: sso }
          # adk-server's A2A v1 surface: gated behind `a2a-v1`, so `--workspace` without feature
          # flags never compiled it. 11 clippy failures had accumulated unseen.
          - { package: adk-server, features: a2a-v1 }
          # Vertex AI sessions use an opt-in Google Cloud transport and wire contract.
          - { package: adk-session, features: vertex-session }
          # The GCS artifact backend is opt-in and must keep blob-name parity with adk-python.
          - { package: adk-artifact, features: gcs }
          # Google Cloud telemetry export is an opt-in transport; no default build compiles it.
          - { package: adk-telemetry, features: gcp }
          # ACP replay and server transport behavior are gated behind the opt-in server feature.
          - { package: adk-acp, features: server }
          # The Monty Python executors and the MontyPythonCodeTool live path: both gated,
          # so default builds skip them entirely.
          - { package: adk-code, features: embedded-python }
          - { package: adk-tool, features: code-embedded-python }
          # The Example Store client (Vertex AI few-shot retrieval) is opt-in; no default
          # build compiles its wire contract or contract tests.
          - { package: adk-tool, features: example-store }
          # The Agent Engine sandbox client (vertex-sandbox) is opt-in; its mock contract
          # tests only run with the feature on.
          - { package: adk-code, features: vertex-sandbox }
          # `mcp-sampling` gates three rmcp model types that the workspace build never
          # reaches: `adk-computer-use` pulls in `adk-tool/mcp`, but nothing in the
          # workspace enables `mcp-sampling`. Its only cover was `examples/mcp_sampling`,
          # so an rmcp rename broke the sampling handler while workspace clippy stayed at
          # zero. Named here so the coverage no longer depends on an example crate.
          - { package: adk-tool, features: mcp-sampling }
          # No workspace member enables these four, so `--workspace` never compiled
          # them and their only cover was a standalone example crate. Four clippy
          # failures and two uncompilable doc examples sat on main as a result.
          # `time-travel` is absent on purpose: adk-cli already enables it, so the
          # workspace build reaches it.
          - { package: adk-graph, features: functional }
          - { package: adk-graph, features: sqlite }
          - { package: adk-graph, features: node-cache }
          - { package: adk-graph, features: delta-checkpoint }
          # The umbrella forwards, because `graph` alone gives adk-graph its
          # default features, which are empty.
          - { package: adk-rust, features: graph-sqlite }
          - { package: adk-rust, features: graph-functional }
          # The sqlx-backed production backends. None were built by any job, so a
          # second sqlx major entering the graph through pgvector went unnoticed:
          # `adk-memory --features database-memory` stopped compiling entirely
          # while every required check stayed green.
          - { package: adk-memory, features: database-memory }
          - { package: adk-rag, features: pgvector }
          - { package: adk-session, features: postgres }
          # The umbrella's code-execution opt-ins (not part of any tier): the embedded
          # JS/Python live paths, persistent Docker, and the CodeActAgent + MontyRuntime
          # forward. `code-tools` itself is covered by the `full` builds in docs/examples.
          - { package: adk-rust, features: "code-embedded-js,code-embedded-python,code-docker,codeact-monty" }
          # The gemini-agent-platform meta-feature (default `minimal` + gemini-agent-platform):
          # enforces the growth rule structurally — a forgotten umbrella forwarding
          # fails this build once the constituent is referenced. The `-full` variant
          # (realtime stack) is nightly-only to keep PR-tier feedback fast.
          - { package: adk-rust, features: gemini-agent-platform }
    steps:
    - uses: actions/checkout@v7

    # Toolchain (with clippy) + wild-linker strip + build cache from the shared
    # action. neutralize-wild defaults to true, correct for this plain runner.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        components: clippy
        cache-key: feature-coverage-${{ matrix.package }}-${{ matrix.features }}
        cache-save: 'false'

    # protoc is required by lancedb's build script (adk-rag --features lancedb).
    # Unconditional rather than gated on the matrix entry: the job header
    # promises that covering a new feature costs ONE matrix line, and an `if:`
    # keyed to a package name would break that for the next entry that needs a
    # system dep. Cost is a prebuilt-binary download on the other entries.
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # libdbus-1 is linked at build time by adk-cli's keyring dependency
    # (sync-secret-service on Linux). The workspace `test` job gets dbus from
    # the devenv/nix shell; this plain runner must install it. Unconditional
    # for the same reason as protoc above.
    - name: Install libdbus
      run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2.86.4
      with:
        tool: cargo-nextest

    - name: Clippy (${{ matrix.package }} --features ${{ matrix.features }})
      run: cargo clippy -p ${{ matrix.package }} --features ${{ matrix.features }} --all-targets -- -D warnings

    - name: Test (${{ matrix.package }} --features ${{ matrix.features }})
      run: cargo nextest run -p ${{ matrix.package }} --features ${{ matrix.features }}

  # ── Docs: documentation coverage for Stable-tier crates ──────
  docs:
    needs: fmt
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
    - uses: actions/checkout@v7

    # Documentation needs the pinned Rust toolchain, not the full devenv
    # shell. Running directly avoids Nix bootstrap latency and transient
    # invalid-store-path failures while retaining the workspace build cache.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: pr-docs
        cache-save: 'false'

    # adk-cli's keyring dependency links libdbus on Linux even when rustdoc is
    # only documenting the workspace's default feature sets.
    - name: Install documentation system dependencies
      run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

    - name: Check documentation coverage
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: |
        echo "### 📚 Documentation Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if cargo doc --workspace --no-deps; then
          echo "✅ Workspace documentation built with no warnings" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ Workspace documentation build failed (missing or broken docs)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Documentation coverage check failed"
          exit 1
        fi

    # Doctests: nextest cannot run them, so `ws-test` never touches a single doc
    # example. Without this step a documented snippet can stop compiling and no
    # job notices — that is how five broken examples reached the 2.0.0 review in
    # `adk-rust`'s crate-level docs.
    #
    # `adk-rust` is excluded from the workspace pass and run separately under
    # `full`: its crate-level docs cover the whole API surface, so the examples
    # only resolve when the optional modules they reference are compiled in. That
    # matches the feature set docs.rs renders (see adk-rust's
    # [package.metadata.docs.rs]).
    - name: Run doctests
      run: |
        cargo test --workspace --doc --exclude adk-rust
        cargo test -p adk-rust --features full --doc

    - name: Doctest summary
      if: always()
      run: echo "### 🧪 doctests (workspace + adk-rust --features full) completed" >> "$GITHUB_STEP_SUMMARY"

  # ── Standalone examples: compile every examples/* crate ────────
  # The standalone examples are separate workspaces, so the workspace build does
  # not catch public-API breakage or stale example lockfiles. Run the four
  # shards before merge; each shard shares one target directory across its
  # examples to avoid rebuilding common ADK crates.
  examples-compile:
    name: examples-compile (${{ matrix.shard }}/4)
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: pr-examples-compile-${{ matrix.shard }}
        cache-save: 'false'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake protobuf-compiler libdbus-1-dev libasound2-dev libudev-dev

    - name: Compile standalone examples (shard ${{ matrix.shard }} of 4)
      run: bash scripts/check-examples-compile.sh ${{ matrix.shard }} 4

    - name: Examples summary
      if: always()
      shell: bash
      run: echo "### 📦 standalone example compile, shard ${{ matrix.shard }} of 4" >> "$GITHUB_STEP_SUMMARY"

  # ── Scaffolds: cargo-adk generated projects compile ────────────
  templates:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: pr-templates
        cache-save: 'false'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake protobuf-compiler libdbus-1-dev libasound2-dev libudev-dev

    - name: Check cargo-adk templates
      run: |
        bash scripts/check-example-name-collisions.sh
        bash scripts/check-doc-examples.sh
        # Doc rot guard: dependency-snippet versions in docs/READMEs/lib.rs must
        # match the workspace version, and every adk-rust feature named in docs
        # must exist in adk-rust/Cargo.toml (catches stale "0.8.2" snippets and
        # phantom features like the removed `labs`).
        bash scripts/check-doc-versions.sh
        # Release-statement guard: the changelog heading, README banner, and
        # roadmap "current" marker are all derived from one source — the
        # workspace version — so a bump cannot land with any of them stale.
        # check-doc-versions.sh skips CHANGELOG.md and never looked at the
        # banner or roadmap, which is how those three drifted apart.
        bash scripts/check-release-consistency.sh
        # Publish-order guard: publish.sh tiers must satisfy the workspace
        # dependency graph, including versioned dev-deps (what broke v1.0.0).
        bash scripts/check-publish-order.sh
        # Scaffold every advertised template — including addon combos and
        # default-provider resolution — and cargo-check the generated projects.
        bash scripts/check-cargo-adk-templates.sh

  # ── Cross-platform: macOS compile-only build ───────────────────
  # PR tier is compile-only; the full nextest run moves to the merge tier
  # (ci-merge.yml). setup-rust supplies the toolchain + build cache;
  # neutralize-wild is false because the wild-linker strip is Linux-only.
  macos:
    needs: fmt
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        cache-key: cross-platform-test-macos-latest
        cache-shared-key: cross-platform-test
        cache-save: 'false'

    - name: Install system dependencies
      run: brew install cmake protobuf

    - name: Build workspace
      run: cargo build --workspace

    - name: Build summary
      if: always()
      run: echo "### 🍎 macOS compile-only build passed" >> "$GITHUB_STEP_SUMMARY"

  # ── Cross-platform: Windows build + portability smoke ──────────
  # The full nextest run stays in the merge tier (ci-merge.yml). The focused
  # output-cap suite runs here because its process scripts are platform-specific
  # and must fail before merge when they stop working on Windows.
  windows:
    needs: fmt
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        cache-key: cross-platform-test-windows-latest
        cache-shared-key: cross-platform-test
        cache-save: 'false'

    - name: Install cmake
      uses: lukka/get-cmake@latest

    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build workspace
      run: cargo build --workspace

    - name: Run sandbox output-cap portability smoke
      run: cargo test -p adk-sandbox --test output_cap_tests

    - name: Run sandbox Rust compilation portability smoke
      run: cargo test -p adk-sandbox --test process_enforcement_tests a_working_program_still_runs -- --exact

    - name: Build summary
      if: always()
      run: echo "### 🪟 Windows build and sandbox portability smoke passed" >> $env:GITHUB_STEP_SUMMARY

  # ── Stable branch-protection contract ──────────────────────────────────
  # Matrix entries remain individually visible for diagnosis, while branch
  # protection only needs this stable aggregate context. Adding a feature or
  # example shard therefore cannot silently drift out of the required set.
  pr-gate:
    name: pr-gate
    if: always()
    needs:
      - fmt
      - webui
      - clippy
      - test
      - feature-coverage
      - docs
      - examples-compile
      - templates
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Require every PR-tier job to pass
      shell: bash
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: |
        failed_jobs="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$JOB_RESULTS")"
        if [[ -n "$failed_jobs" ]]; then
          echo "::error::PR tier did not pass:"
          echo "$failed_jobs"
          exit 1
        fi
        echo "All PR-tier jobs passed."
