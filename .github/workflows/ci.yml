name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  PROTOC: protoc

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate: formatting (< 30s) ──────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv
    - name: Check formatting
      run: CI=true devenv shell ws-fmt -- --check

  # ── Lint: clippy (parallel with test) ──────────────────────────
  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet

    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Cache cargo artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/sccache
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: clippy-${{ runner.os }}-

    - name: Run clippy
      run: CI=true devenv shell ws-clippy --message-format=json | tee clippy.json

    - name: Annotate clippy warnings
      if: always()
      run: |
        if [ -f clippy.json ]; then
          ERRORS=$(grep -c '"level":"error"' clippy.json || echo 0)
          WARNINGS=$(grep -c '"level":"warning"' clippy.json || echo 0)
          echo "### 🔍 Clippy: ${ERRORS} errors, ${WARNINGS} warnings" >> "$GITHUB_STEP_SUMMARY"
        fi

  # ── Test: nextest (parallel with clippy) ───────────────────────
  test:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet

    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Cache cargo artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/sccache
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: test-${{ runner.os }}-

    - name: Run tests
      run: CI=true devenv shell ws-test-ci | tee test.log

    - name: Generate computer-use v8 ADK evaluation receipt
      run: CI=true devenv shell node scripts/generate-computer-use-v8-evidence.mjs --subject-version "${COMPUTER_USE_MCP_V8_VERSION}" --output adk-computer-use-v8-evidence.json --compact
      env:
        COMPUTER_USE_MCP_V8_VERSION: "7.0.0"

    - name: Upload computer-use v8 ADK evaluation receipt
      uses: actions/upload-artifact@v7
      with:
        name: adk-computer-use-v8-evidence
        path: adk-computer-use-v8-evidence.json
        if-no-files-found: error

    - name: Test summary
      if: always()
      run: |
        if [ -f test.log ] && grep -q "tests run:" test.log; then
          SUMMARY=$(grep "tests run:" test.log | tail -1)
          echo "### 🧪 $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi

  # ── Feature coverage: feature-gated modules default CI skips ───
  # Default clippy/test builds never compile feature-gated modules (e.g.
  # `adk-agent`'s `codeact`), so a regression there is invisible on the normal
  # PR path. This job compiles + tests each such module under its feature on a
  # plain runner via the shared setup-rust action (components + wild-linker
  # strip + cache come from there — no per-job setup drift).
  #
  # System build deps needed by any matrix entry (currently just protoc, for
  # `adk-rag --features lancedb`) are installed unconditionally below, so the
  # "add ONE line" invariant holds without touching the steps.
  #
  # `adk-rag --features lancedb` is the slowest entry — it pulls the whole
  # lance/datafusion tree. It lives in the PR tier on purpose: an arrow version
  # mismatch sat broken on main for weeks because nothing in CI compiled the
  # LanceDB backend, and nightly would let the next bad bump land on main first.
  #
  # To cover another feature-gated module, add ONE line to the matrix below:
  #   - { package: <crate>, features: <feature> }
  feature-coverage:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: adk-agent, features: codeact }
          - { package: adk-model, features: openrouter }
          - { package: adk-sandbox, features: wasm }
          # sandbox-linux is Linux-only *and* feature-gated, so nothing built it until a
          # container run found the bubblewrap probe could never succeed and that its
          # property tests did not compile.
          - { package: adk-sandbox, features: sandbox-linux }
          # ambient and integration carry the webhook trigger, the ambient loop, and the
          # realtime integration layer. Two individually-green PRs broke the ambient build
          # in combination because no job compiled it.
          - { package: adk-agent, features: ambient }
          - { package: adk-realtime, features: integration }
          - { package: adk-managed, features: memory }
          - { package: adk-audio, features: fx }
          - { package: adk-rag, features: lancedb }
          # adk-auth's SSO/OAuth surface: gated behind `sso`, so `--workspace` without
          # feature flags never compiled it. It had drifted out of the clippy gate, and a
          # jsonwebtoken major bump broke it while every required check stayed green.
          - { package: adk-auth, features: sso }
          # adk-server's A2A v1 surface: gated behind `a2a-v1`, so `--workspace` without feature
          # flags never compiled it. 11 clippy failures had accumulated unseen.
          - { package: adk-server, features: a2a-v1 }
          # Vertex AI sessions use an opt-in Google Cloud transport and wire contract.
          - { package: adk-session, features: vertex-session }
          # ACP replay and server transport behavior are gated behind the opt-in server feature.
          - { package: adk-acp, features: server }
    steps:
    - uses: actions/checkout@v7

    # Toolchain (with clippy) + wild-linker strip + build cache from the shared
    # action. neutralize-wild defaults to true, correct for this plain runner.
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        components: clippy
        cache-key: feature-coverage-${{ matrix.package }}-${{ matrix.features }}

    # protoc is required by lancedb's build script (adk-rag --features lancedb).
    # Unconditional rather than gated on the matrix entry: the job header
    # promises that covering a new feature costs ONE matrix line, and an `if:`
    # keyed to a package name would break that for the next entry that needs a
    # system dep. Cost is a prebuilt-binary download on the other entries.
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Clippy (${{ matrix.package }} --features ${{ matrix.features }})
      run: cargo clippy -p ${{ matrix.package }} --features ${{ matrix.features }} --all-targets -- -D warnings

    - name: Test (${{ matrix.package }} --features ${{ matrix.features }})
      run: cargo nextest run -p ${{ matrix.package }} --features ${{ matrix.features }}

  # ── Docs: documentation coverage for Stable-tier crates ──────
  docs:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Cache cargo artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/sccache
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: docs-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: docs-${{ runner.os }}-

    - name: Check documentation coverage
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: |
        echo "### 📚 Documentation Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if CI=true devenv shell cargo doc --workspace --no-deps; then
          echo "✅ Workspace documentation built with no warnings" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ Workspace documentation build failed (missing or broken docs)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Documentation coverage check failed"
          exit 1
        fi

    # Doctests: nextest cannot run them, so `ws-test` never touches a single doc
    # example. Without this step a documented snippet can stop compiling and no
    # job notices — that is how five broken examples reached the 2.0.0 review in
    # `adk-rust`'s crate-level docs.
    #
    # `adk-rust` is excluded from the workspace pass and run separately under
    # `full`: its crate-level docs cover the whole API surface, so the examples
    # only resolve when the optional modules they reference are compiled in. That
    # matches the feature set docs.rs renders (see adk-rust's
    # [package.metadata.docs.rs]).
    - name: Run doctests
      run: |
        CI=true devenv shell cargo test --workspace --doc --exclude adk-rust
        CI=true devenv shell cargo test -p adk-rust --features full --doc

    - name: Doctest summary
      if: always()
      run: echo "### 🧪 doctests (workspace + adk-rust --features full) completed" >> "$GITHUB_STEP_SUMMARY"

  # ── Standalone examples: compile every examples/* crate ────────
  # The standalone examples are separate workspaces, so the workspace build does
  # not catch public-API breakage or stale example lockfiles. Run the four
  # shards before merge; each shard shares one target directory across its
  # examples to avoid rebuilding common ADK crates.
  examples-compile:
    name: examples-compile (${{ matrix.shard }}/4)
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: pr-examples-compile-${{ matrix.shard }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake protobuf-compiler libdbus-1-dev libasound2-dev libudev-dev

    - name: Compile standalone examples (shard ${{ matrix.shard }} of 4)
      run: bash scripts/check-examples-compile.sh ${{ matrix.shard }} 4

    - name: Examples summary
      if: always()
      shell: bash
      run: echo "### 📦 standalone example compile, shard ${{ matrix.shard }} of 4" >> "$GITHUB_STEP_SUMMARY"

  # ── Scaffolds: cargo-adk generated projects compile ────────────
  templates:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Cache cargo artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/sccache
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: templates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: templates-${{ runner.os }}-

    - name: Check cargo-adk templates
      run: |
        CI=true devenv shell bash scripts/check-example-name-collisions.sh
        CI=true devenv shell bash scripts/check-doc-examples.sh
        # Doc rot guard: dependency-snippet versions in docs/READMEs/lib.rs must
        # match the workspace version, and every adk-rust feature named in docs
        # must exist in adk-rust/Cargo.toml (catches stale "0.8.2" snippets and
        # phantom features like the removed `labs`).
        CI=true devenv shell bash scripts/check-doc-versions.sh
        # Release-statement guard: the changelog heading, README banner, and
        # roadmap "current" marker are all derived from one source — the
        # workspace version — so a bump cannot land with any of them stale.
        # check-doc-versions.sh skips CHANGELOG.md and never looked at the
        # banner or roadmap, which is how those three drifted apart.
        CI=true devenv shell bash scripts/check-release-consistency.sh
        # Publish-order guard: publish.sh tiers must satisfy the workspace
        # dependency graph, including versioned dev-deps (what broke v1.0.0).
        CI=true devenv shell bash scripts/check-publish-order.sh
        # Scaffold every advertised template — including addon combos and
        # default-provider resolution — and cargo-check the generated projects.
        CI=true devenv shell bash scripts/check-cargo-adk-templates.sh

  # ── Cross-platform: macOS compile-only build ───────────────────
  # PR tier is compile-only; the full nextest run moves to the merge tier
  # (ci-merge.yml). setup-rust supplies the toolchain + build cache;
  # neutralize-wild is false because the wild-linker strip is Linux-only.
  macos:
    needs: fmt
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        cache-key: macos

    - name: Install system dependencies
      run: brew install cmake protobuf

    - name: Build workspace
      run: cargo build --workspace

    - name: Build summary
      if: always()
      run: echo "### 🍎 macOS compile-only build passed" >> "$GITHUB_STEP_SUMMARY"

  # ── Cross-platform: Windows build + portability smoke ──────────
  # The full nextest run stays in the merge tier (ci-merge.yml). The focused
  # output-cap suite runs here because its process scripts are platform-specific
  # and must fail before merge when they stop working on Windows.
  windows:
    needs: fmt
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        cache-key: windows

    - name: Install cmake
      uses: lukka/get-cmake@latest

    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build workspace
      run: cargo build --workspace

    - name: Run sandbox output-cap portability smoke
      run: cargo test -p adk-sandbox --test output_cap_tests

    - name: Build summary
      if: always()
      run: echo "### 🪟 Windows build and sandbox portability smoke passed" >> $env:GITHUB_STEP_SUMMARY
