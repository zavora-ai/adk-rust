name: CI Nightly

# Nightly tier (see ci-pipeline-restructure spec, design.md §5 + Requirement 2.3).
# Runs on a schedule — carrying the most expensive coverage that is deliberately
# kept off both the per-PR and per-merge paths because it is broad, slow, or
# needs credentials that are not available on ordinary runs:
#   • feature-combinations — compile the notable feature combos that default CI
#     (ci.yml) never builds (realtime `full`, audio ONNX backends, GPU features).
#   • supply-chain — `cargo audit` (enforcing) + `cargo deny` (advisory) over the
#     workspace dependency graph.
#   • durable-stores — the store and graph checkpointer conformance suites, the
#     kernel's store suites, and the multi-process durability gates against live
#     PostgreSQL, Redis, MongoDB, Neo4j, and the Firestore emulator.
#   • integration-tests — the `#[ignore]`d integration tests that hit real
#     provider APIs, gated on the relevant secrets being configured.
#   • site-hosts, site-generators — adk-site's host adapters against MinIO, Azurite
#     and an SSH server, the CalDAV driver against Radicale, and the real site
#     generators under bubblewrap and the Windows restricted token (spec 3.5 §11).
#
# This is an INFORMATIONAL tier: per the spec's required-check policy these jobs
# are NOT branch-protection-required. A nightly failure is a signal to triage,
# not a merge blocker.
#
# All Rust runner preparation goes through the shared setup-rust composite action
# so toolchain/components/linker/cache can never drift per-workflow.

on:
  schedule:
    # 03:00 UTC every day — quiet period, off the merge-tier path.
    - cron: '0 3 * * *'
  # Allow maintainers to trigger a nightly run on demand from the Actions tab, or one job of
  # it on a branch: `gh workflow run ci-nightly.yml --ref <branch> -f job=durable-stores`.
  workflow_dispatch:
    inputs:
      job:
        description: The job to run; `all` runs every job
        type: choice
        default: all
        options: [all, feature-combinations, supply-chain, durable-stores, integration-tests, harness-eval-live, site-soak, website-wordpress, website-soak, site-hosts, site-generators]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  PROTOC: protoc

# Nightly runs are not latency-sensitive; let an in-progress run complete rather
# than cancelling it when the schedule fires again.
concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Feature-combination matrix ─────────────────────────────────
  # Requirement 2.3 (full feature-combination checks on a scheduled trigger) and
  # design.md §5 (audio ONNX, realtime `full`, GPU compile-checks). Default CI
  # (ci.yml clippy/test) only ever builds default features, so a regression in a
  # non-default feature combination is invisible on the PR and merge tiers. This
  # job lints each notable combo on the appropriate runner.
  #
  # These run `cargo clippy -- -D warnings`, not `cargo check`. Compiling proved
  # too weak: the 2.0.0 release review found 15 clippy errors sitting in
  # feature-gated modules (adk-audio ONNX, adk-graph `functional` and
  # `action-full`, adk-server `background`, adk-anthropic `managed-agents`) that
  # no gate had ever linted. GPU combos stay compile-only because their
  # toolchains are not fully available on hosted runners.
  #
  # Feature names below were verified against the real Cargo.toml manifests:
  #   • adk-realtime  `full`  = openai + gemini + vertex-live + livekit
  #   • adk-audio     `all-onnx` = every ONNX backend (implies `onnx`)
  #   • adk-graph     `functional`, `action-full` = functional API, action nodes
  #   • adk-server    `background` = background runs + cron scheduling
  #   • adk-mistralrs `metal` = mistralrs/metal (macOS GPU acceleration)
  #
  # EXTENSION POINT: to cover another feature combination, append one matrix
  # entry with { name, os, neutralize-wild, command }. Prefer clippy with
  # `-D warnings`; keep GPU/hardware combos compile-only (`cargo check`) on a
  # runner whose toolchain supports them.
  feature-combinations:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'feature-combinations' }}
    name: features (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # realtime with all providers/transports (no WebRTC — that needs cmake
          # + the openai-webrtc feature; `full` deliberately excludes it).
          - name: realtime-full
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-realtime --features full --all-targets -- -D warnings
          # Every audio ONNX backend. `kokoro` pulls the espeak-ng system dep,
          # installed in the step below.
          - name: audio-all-onnx
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-audio --features all-onnx --all-targets -- -D warnings
          # Functional graph API (#[entrypoint]/#[task] macros, typed reducers).
          - name: graph-functional
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-graph --features functional --all-targets -- -D warnings
          # Every action-node executor (http, db, code, email, rss, trigger).
          - name: graph-action-full
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-graph --features action-full --all-targets -- -D warnings
          # Background runs + cron scheduling REST surface.
          - name: server-background
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-server --features background --all-targets -- -D warnings
          # Anthropic Managed Agents + Files APIs.
          - name: anthropic-managed-agents
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-anthropic --features managed-agents,files --all-targets -- -D warnings
          # Every provider in the model facade.
          - name: model-all-providers
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-model --features all-providers --all-targets -- -D warnings
          # GPU compile-check: Metal acceleration for adk-mistralrs. Compile-only
          # (`cargo check`) on macOS, where the Metal toolchain is present even
          # though the runner has no discrete GPU to execute against.
          - name: mistralrs-metal
            os: macos-latest
            neutralize-wild: 'false'
            command: cargo check -p adk-mistralrs --features metal
          # Gemini Enterprise Agent Platform meta-features on the umbrella crate.
          # `gemini-agent-platform` also runs in the PR-tier feature-coverage matrix; the
          # `-full` variant compiles the adk-realtime stack (vertex-live) and is
          # nightly-only to keep PR-tier feedback fast.
          - name: umbrella-gemini-agent-platform
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-rust --no-default-features --features minimal,gemini-agent-platform --all-targets -- -D warnings
          - name: umbrella-gemini-agent-platform-full
            os: ubuntu-latest
            neutralize-wild: 'true'
            command: cargo clippy -p adk-rust --no-default-features --features minimal,gemini-agent-platform-full --all-targets -- -D warnings
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        components: clippy
        enable-cache: 'false'
        neutralize-wild: ${{ matrix.neutralize-wild }}

    # espeak-ng is required by adk-audio's `kokoro` backend. glib is required by
    # the WebRTC transport in adk-realtime's `full` feature. On Linux, cmake comes
    # from the runner image, whose /usr/local/bin precedes apt's /usr/bin on PATH.
    - name: Install system dependencies (Linux)
      # A stalled apt mirror once held jobs for the full six-hour limit; the action bounds and
      # retries each apt attempt, and the step timeout bounds the whole install.
      timeout-minutes: 10
      if: runner.os == 'Linux'
      uses: ./.github/actions/apt-install
      with:
        packages: protobuf-compiler libespeak-ng-dev libglib2.0-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake protobuf espeak-ng

    - name: Lint feature combination
      run: ${{ matrix.command }}

  # ── Supply-chain: advisory + policy checks ─────────────────────
  # Requirement 2.3 (supply-chain checks on a scheduled trigger). Two tools:
  #   • cargo-audit — scans the workspace Cargo.lock against the RustSec advisory
  #     DB. It honours the repo's .cargo/audit.toml, so advisories reviewed and
  #     accepted there (see docs/security/DEPENDENCY-ADVISORIES.md) are skipped
  #     while NEW advisories surface as failures. This is the ENFORCING gate.
  #   • cargo-deny — broader supply-chain policy (bans, sources, licenses,
  #     advisories) configured by the root `deny.toml`. Its accepted-advisory list
  #     mirrors `.cargo/audit.toml` (cargo-deny does not read that file), and it
  #     additionally enforces the license allow-list, the registry allow-list, and
  #     the `quick-xml` and `zip` version floors. Both gates are ENFORCING.
  supply-chain:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'supply-chain' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Install cargo-audit and cargo-deny
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-audit,cargo-deny

    # Enforcing: reads .cargo/audit.toml + workspace Cargo.lock.
    - name: cargo audit
      run: cargo audit

    # Enforcing: reads the root deny.toml.
    - name: cargo deny check
      run: cargo deny check

  # ── Durable stores: conformance suites on live backends ────────
  # Every SpendLedger, ActionLedger, and ApprovalStore backend in adk-session runs the
  # adk-core conformance suites, and the kernel's process, agenda, driver, ledger, partition
  # and cron watermark stores run theirs on MongoDB, Neo4j and Firestore (spec 3.2 §13 Q8).
  # SQLite runs on every PR (feature-coverage shard 5); the
  # server-backed suites are #[ignore]d and run here against service containers. The
  # multi-process durability gates (adk-durability-gates) run here on every server
  # backend; their SQLite gates run on every PR in feature-coverage shard 2 (the
  # `adk-durability-gates sqlite` pair). Needs no secrets.
  durable-stores:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'durable-stores' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # postgres:17 plus pgvector, the image the PR-tier `postgres` job uses.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Standalone server: the run store's single-document fallback path. The primary
      # MongoDB (a single-node replica set, started below) covers the transactional path.
      mongodb-standalone:
        image: mongo:7
        ports: ["27018:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/conformance-pass
          NEO4J_server_memory_heap_max__size: 512m
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p conformance-pass 'RETURN 1'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      MONGODB_URL: mongodb://localhost:27017/?directConnection=true
      MONGODB_REQUIRE_TRANSACTIONS: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: conformance-pass
      FIRESTORE_EMULATOR_HOST: localhost:8080
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Install cargo-nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest

    # The emulator needs a start command, which service containers cannot pass.
    # Service containers cannot pass `--replSet`, so the replica set starts here.
    - name: Start MongoDB as a single-node replica set
      timeout-minutes: 5
      run: |
        docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
        for _ in $(seq 60); do
          docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
          sleep 2
        done
        docker exec mongo-rs mongosh --quiet --eval \
          'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
        for _ in $(seq 60); do
          docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && exit 0
          sleep 2
        done
        docker logs mongo-rs
        exit 1

    - name: Start the Firestore emulator
      timeout-minutes: 10
      run: |
        docker run -d --name firestore -p 8080:8080 \
          gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
          gcloud emulators firestore start --host-port=0.0.0.0:8080
        for _ in $(seq 120); do curl -sf http://localhost:8080 >/dev/null && exit 0; sleep 2; done
        docker logs firestore
        exit 1

    - name: Run store conformance suites
      run: >-
        cargo nextest run -p adk-session
        --features sqlite,postgres,redis,mongodb,neo4j,firestore
        --run-ignored all --no-fail-fast
        --test store_conformance_sqlite
        --test store_conformance_postgres
        --test run_store_multiprocess_postgres
        --test store_conformance_redis
        --test store_conformance_mongodb
        --test store_conformance_neo4j
        --test store_conformance_firestore
        --test spend_ledger_postgres

    # The Phase 2 gates — crash mid-payment, one firing per schedule, stalled worker,
    # kill switch — with separate worker, scheduler, and replica processes on every
    # backend. Gates on one server run one at a time (`.config/nextest.toml` groups).
    - name: Run the multi-process durability gates on every backend
      if: ${{ !cancelled() }}
      run: >-
        cargo nextest run -p adk-durability-gates
        --features all-backends
        --run-ignored all --no-fail-fast

    - name: Run MongoDB store suites on a standalone server
      if: ${{ !cancelled() }}
      env:
        MONGODB_URL: mongodb://localhost:27018
        MONGODB_REQUIRE_TRANSACTIONS: "0"
      run: >-
        cargo nextest run -p adk-session
        --features sqlite,postgres,redis,mongodb,neo4j,firestore
        --run-ignored all --no-fail-fast
        --test store_conformance_mongodb

    # The kernel's stores on MongoDB, Firestore and Neo4j (spec 3.2 §7.1, §13 Q8). They need no
    # multi-document transaction, so the standalone server runs the MongoDB suite as well.
    - name: Run the kernel's MongoDB, Firestore and Neo4j store suites
      if: ${{ !cancelled() }}
      run: >-
        cargo nextest run -p adk-kernel
        --features mongodb,neo4j,firestore
        --run-ignored all --no-fail-fast
        --test store_conformance_mongodb
        --test store_conformance_neo4j
        --test store_conformance_firestore

    - name: Run the kernel's MongoDB store suite on a standalone server
      if: ${{ !cancelled() }}
      env:
        MONGODB_URL: mongodb://localhost:27018
      run: >-
        cargo nextest run -p adk-kernel
        --features mongodb,neo4j,firestore
        --run-ignored all --no-fail-fast
        --test store_conformance_mongodb

    - name: Run graph checkpointer conformance suites
      if: ${{ !cancelled() }}
      run: >-
        cargo nextest run -p adk-graph
        --features sqlite,postgres,redis,mongodb,neo4j,firestore
        --run-ignored all --no-fail-fast
        --test checkpointer_conformance
        --test checkpointer_conformance_postgres
        --test checkpointer_conformance_redis
        --test checkpointer_conformance_mongodb
        --test checkpointer_conformance_neo4j
        --test checkpointer_conformance_firestore

  # ── S19 soak: a site that never stops changing (spec 3.5 §11) ──
  # 50,000 products fed every minute for 24 simulated hours on a warped clock against
  # `DirectoryHost`, with a corrupted delivery, a live blog, a revert and the Guardian
  # probing throughout. Optimised build; the PR tier runs the scaled scenario.
  site-soak:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'site-soak' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Install cargo-nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest

    - name: Run S19 for 24 simulated hours
      env:
        ADK_SITE_S19_FULL: '1'
      run: >-
        cargo nextest run -p adk-site --features migrate --cargo-profile ci
        --run-ignored only -E 'test(s19_full_day)' --no-capture

  # ── adk-website: the WordPress fixture (spec 3.5 §11) ─────────
  # The compose fixture in examples/website/fixtures/wordpress, clean and with its `infected`
  # overlay, against the recordings the PR tier runs on; and adk-site's Docker replay.
  website-wordpress:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'website-wordpress' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Install cargo-nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest

    - name: Start and seed the WordPress fixture
      working-directory: examples/website/fixtures/wordpress
      run: |
        docker compose up -d --wait
        docker compose run --rm seed

    - name: Run against the clean site
      run: cargo run --locked --manifest-path examples/website/Cargo.toml -- wordpress http://127.0.0.1:8080

    - name: Apply the infected overlay
      working-directory: examples/website/fixtures/wordpress
      run: |
        docker compose -f compose.yaml -f compose.infected.yaml up -d --wait
        docker compose -f compose.yaml -f compose.infected.yaml run --rm infect

    - name: Run against the infected site
      run: cargo run --locked --manifest-path examples/website/Cargo.toml -- wordpress http://127.0.0.1:8080 --infected

    - name: Replay a WordPress dump in isolation through Docker
      run: >-
        cargo nextest run -p adk-site --features migrate --run-ignored only
        -E 'test(docker_replay_is_isolated_and_destroyed)'

    - name: Stop the fixture
      if: always()
      working-directory: examples/website/fixtures/wordpress
      run: docker compose -f compose.yaml -f compose.infected.yaml down -v

  # ── adk-website: the S19 soak (spec 3.5 §11 "Soak") ───────────
  # 50,000 products over 24 simulated hours on the product's runtime, update engine, alarm
  # routing, Guardian probe and weekly review; the report is the job's artifact.
  website-soak:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'website-soak' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Run S19 for 24 simulated hours
      run: cargo run --locked --release --manifest-path examples/website/Cargo.toml -- soak --report s19-soak.json

    - name: Upload the soak report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: s19-soak
        path: s19-soak.json
        if-no-files-found: ignore

  # ── adk-site: host adapters against real servers (spec 3.5 §7.8 "Hosts", §11) ──
  # The `#[ignore]`d host conformance suites against MinIO (S3), Azurite (Azure Blob) and an
  # OpenSSH server with rsync, and adk-website's CalDAV calendar driver against Radicale.
  # MinIO needs its `server` command, Azurite `--skipApiVersionCheck` and the SSH server a key
  # this job makes, none of which a service container can take, so all three start with
  # `docker run`; Radicale runs from PyPI. MinIO's own images are no longer published, so the
  # community `pgsty/minio` build of the same server is used.
  site-hosts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'site-hosts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADK_SITE_S3_ENDPOINT: http://127.0.0.1:9000
      ADK_SITE_S3_BUCKET: adk-site
      ADK_SITE_S3_KEYS: '{"accessKeyId":"adk","secretAccessKey":"adk-site-secret"}'
      # Azurite's published development account; its key is not a secret.
      ADK_SITE_AZURE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
      ADK_SITE_AZURE_ACCOUNT: devstoreaccount1
      ADK_SITE_AZURE_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      ADK_SITE_RSYNC_DESTINATION: deploy@127.0.0.1
      ADK_SITE_RSYNC_PORT: "2222"
      ADK_SITE_RSYNC_ROOT: /config/site
      ADK_WEBSITE_CALDAV_HOME: http://127.0.0.1:5232/juniper/
      ADK_WEBSITE_CALDAV_USER: juniper
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Install cargo-nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest

    - name: Start MinIO and make the bucket
      timeout-minutes: 5
      run: |
        docker run -d --name minio -p 127.0.0.1:9000:9000 \
          -e MINIO_ROOT_USER=adk -e MINIO_ROOT_PASSWORD=adk-site-secret \
          pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
        for _ in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 2; done
        curl -sf -X PUT --user adk:adk-site-secret --aws-sigv4 aws:amz:us-east-1:s3 \
          http://127.0.0.1:9000/adk-site

    # The Azure CLI sends a newer storage API version than Azurite knows, so Azurite skips
    # the check; the host adapter itself sends 2021-12-02.
    - name: Start Azurite and make its containers
      timeout-minutes: 5
      run: |
        docker run -d --name azurite -p 127.0.0.1:10000:10000 \
          mcr.microsoft.com/azure-storage/azurite:3.35.0 \
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
        for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:10000/ && break; sleep 1; done
        connection="DefaultEndpointsProtocol=http;AccountName=$ADK_SITE_AZURE_ACCOUNT;AccountKey=$ADK_SITE_AZURE_KEY;BlobEndpoint=$ADK_SITE_AZURE_ENDPOINT;"
        for container in site site-releases; do
          az storage container create --name "$container" --connection-string "$connection" --output none
        done

    - name: Start an SSH server with rsync
      timeout-minutes: 10
      run: |
        key="$RUNNER_TEMP/adk-site-ssh"
        ssh-keygen -q -t ed25519 -N '' -f "$key"
        docker run -d --name sshd -p 127.0.0.1:2222:2222 -e USER_NAME=deploy \
          -e PUBLIC_KEY="$(cat "$key.pub")" -e DOCKER_MODS=linuxserver/mods:openssh-server-rsync \
          lscr.io/linuxserver/openssh-server:version-10.3_p1-r1
        for _ in $(seq 120); do
          known=$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null || true)
          if [ -n "$known" ] && ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$key" -p 2222 \
              deploy@127.0.0.1 'command -v rsync && mkdir -p /config/site' >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        {
          echo "ADK_SITE_RSYNC_KEY<<EOF"; cat "$key"; echo "EOF"
          echo "ADK_SITE_RSYNC_KNOWN_HOSTS<<EOF"; ssh-keyscan -p 2222 127.0.0.1 2>/dev/null; echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Run the host suites against MinIO, Azurite and the SSH server
      run: >-
        cargo nextest run -p adk-site --features host-s3,host-azure,host-rsync
        --run-ignored only --no-fail-fast
        -E 'test(s3_compatible_store) | test(azure_storage) | test(rsync_over_ssh)'

    - name: Start Radicale
      if: ${{ !cancelled() }}
      timeout-minutes: 5
      run: |
        pipx install 'radicale==3.8.3'
        mkdir -p "$RUNNER_TEMP/radicale"
        # Any name signs in (`--auth-type none`); each user owns its own collections.
        nohup radicale --server-hosts 127.0.0.1:5232 --auth-type none --rights-type owner_only \
          --storage-filesystem-folder "$RUNNER_TEMP/radicale" > "$RUNNER_TEMP/radicale.log" 2>&1 &
        for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:5232/ && exit 0; sleep 1; done
        cat "$RUNNER_TEMP/radicale.log"
        exit 1

    - name: Run the CalDAV calendar driver against Radicale
      if: ${{ !cancelled() }}
      run: >-
        cargo nextest run -p adk-website --test caldav
        --run-ignored only -E 'test(live_caldav)'

    - name: Stop the servers
      if: always()
      run: |
        docker rm -f minio azurite sshd || true
        pkill -f 'radicale --server-hosts' || true

  # ── adk-site: the real generators (spec 3.5 §7.8 "Generator", §11) ──
  # Zola, Hugo, Astro and Build Awesome build the fixture site twice each, sandboxed with no
  # network: under bubblewrap on Linux, and under the restricted token on Windows (spec 3.2
  # §10 W5), which also runs the generators' Windows tests. Nothing is installed during a
  # build: the tools are fetched here, at pinned versions.
  site-generators:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'site-generators' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ZOLA_VERSION: 0.23.6
      HUGO_VERSION: 0.167.0
      ASTRO_VERSION: 7.3.8
      ELEVENTY_VERSION: 3.1.6
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: ${{ runner.os == 'Linux' && 'true' || 'false' }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'

    - name: Install bubblewrap
      if: runner.os == 'Linux'
      timeout-minutes: 10
      uses: ./.github/actions/apt-install
      with:
        packages: bubblewrap

    - name: Allow unprivileged user namespaces
      if: runner.os == 'Linux'
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        bwrap --version

    - name: Fetch Zola, Hugo, Astro and Build Awesome
      shell: bash
      run: |
        set -euo pipefail
        tools="$RUNNER_TEMP/tools"
        mkdir -p "$tools"
        zola="https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/zola-v$ZOLA_VERSION"
        hugo="https://github.com/gohugoio/hugo/releases/download/v$HUGO_VERSION/hugo_extended_$HUGO_VERSION"
        if [ "$RUNNER_OS" = "Windows" ]; then
          curl -fsSL -o "$tools/zola.zip" "$zola-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o "$tools/hugo.zip" "${hugo}_windows-amd64.zip"
          (cd "$tools" && 7z x -y zola.zip >/dev/null && 7z x -y hugo.zip hugo.exe >/dev/null)
          suffix=".exe"
        else
          curl -fsSL "$zola-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$tools"
          curl -fsSL "${hugo}_linux-amd64.tar.gz" | tar -xz -C "$tools" hugo
          suffix=""
        fi
        npm install --prefix "$RUNNER_TEMP/astro" --no-audit --no-fund "astro@$ASTRO_VERSION"
        npm install --prefix "$RUNNER_TEMP/eleventy" --no-audit --no-fund "@11ty/eleventy@$ELEVENTY_VERSION"
        {
          echo "ADK_SITE_ZOLA=$tools/zola$suffix"
          echo "ADK_SITE_HUGO=$tools/hugo$suffix"
          echo "ADK_SITE_NODE=$(node -p 'process.execPath')"
          echo "ADK_SITE_ASTRO_MODULES=$RUNNER_TEMP/astro/node_modules"
          echo "ADK_SITE_ELEVENTY_MODULES=$RUNNER_TEMP/eleventy/node_modules"
        } >> "$GITHUB_ENV"
        "$tools/zola$suffix" --version
        "$tools/hugo$suffix" version

    - name: Build the fixture site with each generator, sandboxed
      run: >-
        cargo nextest run -p adk-site --features gen-zola,gen-hugo,gen-astro,gen-build-awesome
        --test generators --run-ignored all --no-fail-fast

  # ── Integration tests: #[ignore]d tests gated on secrets ───────
  # Requirement 2.3 (scheduled integration coverage). The workspace marks tests
  # that hit real provider APIs / external services with `#[ignore]` (see
  # AGENTS.md "Testing"); those never run on the PR or merge tiers. Here we run
  # ONLY the ignored tests (`--run-ignored ignored-only`).
  #
  # Secret gating: GitHub does NOT allow `secrets.*` in a job-level `if:`
  # reliably, so we map the provider secrets into job ENV and gate the actual
  # test step on `env.* != ''`. When no provider secret is configured (e.g. on a
  # fork, or before secrets are added) the tests are skipped with a notice rather
  # than failing. Secrets are passed through env so the tests can authenticate.
  integration-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'integration-tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Install system dependencies (Linux)
      # A stalled apt mirror once held jobs for the full six-hour limit; the action bounds and
      # retries each apt attempt, and the step timeout bounds the whole install.
      timeout-minutes: 10
      uses: ./.github/actions/apt-install
      with:
        packages: protobuf-compiler

    - name: Install cargo-nextest
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest

    # Runs only when at least one provider secret is present. env context is
    # allowed in a step `if:` (secrets context is not), so the mapped env vars
    # above are what we test against.
    # The workspace build enables adk-session's `postgres` feature (adk-managed's tests
    # depend on it), so the PostgreSQL suites compile here but have no server; they run
    # in ci.yml's `postgres` job and the `durable-stores` job above.
    - name: Run ignored integration tests
      if: ${{ env.GOOGLE_API_KEY != '' || env.OPENAI_API_KEY != '' || env.ANTHROPIC_API_KEY != '' }}
      run: >-
        cargo nextest run --workspace --run-ignored ignored-only
        -E 'not (binary(/postgres|pgvector/) or test(/postgres|pgvector/))'

    - name: Skip notice (no provider secrets configured)
      if: ${{ env.GOOGLE_API_KEY == '' && env.OPENAI_API_KEY == '' && env.ANTHROPIC_API_KEY == '' }}
      shell: bash
      run: |
        echo "### ⏭️ integration tests skipped" >> "$GITHUB_STEP_SUMMARY"
        echo "No provider secrets (GOOGLE_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY) configured." >> "$GITHUB_STEP_SUMMARY"

  # ── Harness eval suite on live models (spec 3.1 §7.13) ─────────
  # `examples/harness_eval` runs fix_failing_test, plan_mode_writes_nothing and goal_until
  # on each provider's model and compares the `passed` metric with the provider's
  # BaselineStore baseline (`baseline.live.<provider>.json`); a regression fails the job.
  # The scripted run of the same cases is `adk-harness`'s `eval_suite` test, in the PR tier.
  # Gated on each provider's secret, as the integration tests are.
  harness-eval-live:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'harness-eval-live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            secret: OPENAI_API_KEY
          - provider: anthropic
            secret: ANTHROPIC_API_KEY
          - provider: gemini
            secret: GOOGLE_API_KEY
    # Each job receives only its own provider's key. Literal `secrets.<NAME>` references keep
    # every other secret off the runner, which an indexed `secrets[...]` lookup does not.
    env:
      OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
      GOOGLE_API_KEY: ${{ matrix.provider == 'gemini' && secrets.GOOGLE_API_KEY || '' }}
      PROVIDER_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || matrix.provider == 'gemini' && secrets.GOOGLE_API_KEY || '' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Rust
      if: ${{ env.PROVIDER_KEY != '' }}
      uses: ./.github/actions/setup-rust
      with:
        enable-cache: 'false'
        neutralize-wild: 'true'

    - name: Run the harness eval suite on ${{ matrix.provider }}
      if: ${{ env.PROVIDER_KEY != '' }}
      run: cargo run --locked --manifest-path examples/harness_eval/Cargo.toml -- --live ${{ matrix.provider }}

    - name: Skip notice (no ${{ matrix.secret }} configured)
      if: ${{ env.PROVIDER_KEY == '' }}
      shell: bash
      run: |
        echo "### ⏭️ harness eval (${{ matrix.provider }}) skipped" >> "$GITHUB_STEP_SUMMARY"
        echo "No ${{ matrix.secret }} configured." >> "$GITHUB_STEP_SUMMARY"
