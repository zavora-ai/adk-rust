[package]
name = "adk-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "HTTP server and A2A protocol for Rust Agent Development Kit (ADK-Rust) agents"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/adk-server"
keywords = ["ai", "agent", "adk", "server", "a2a"]
categories = ["api-bindings", "web-programming::http-server"]
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
adk-core = { workspace = true, features = ["auth-bridge"] }
adk-agent = { workspace = true, features = ["skills"] }
adk-runner = { workspace = true, features = ["artifacts", "plugins", "skills"] }
adk-session.workspace = true
adk-skill.workspace = true
adk-artifact.workspace = true
# Optional: Agent Engine dispatch surface (memory class methods)
adk-memory = { workspace = true, optional = true }
adk-gcp = { workspace = true, optional = true }
adk-tool = { workspace = true, optional = true }
google-cloud-auth = { version = "1.8", optional = true, default-features = false, features = ["default-rustls-provider"] }
adk-telemetry.workspace = true
tokio = { workspace = true, features = ["sync", "signal", "macros", "rt", "time"] }
tokio-stream.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "set-header", "limit"] }
tracing = "0.1"
base64 = "0.22"
mime_guess = "2.0.5"
reqwest.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
a2a-protocol-types = { version = "0.12.1", optional = true }
# Optional: YAML agent definition parsing
serde_yaml = { version = "0.9", optional = true }
# Optional: filesystem watcher for hot reload
notify = { version = "8", optional = true }
# Optional: environment variable interpolation in YAML configs
regex = { workspace = true, optional = true }
# Optional: HMAC-SHA256 signature validation for webhooks
hmac = { version = "0.12", optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
# Optional: the AWP 2.0 agent edge (`awp` feature, spec 3.5 §7.9)
adk-awp = { workspace = true, optional = true, features = ["signing"] }
awp-types = { workspace = true, optional = true }
adk-auth = { workspace = true, optional = true, features = ["web-bot-auth", "sso"] }
http = { version = "1", optional = true }
# Optional: the edge's durable stores (`awp-sqlite`, `awp-postgres`, `awp-redis`)
sqlx = { workspace = true, optional = true, features = ["runtime-tokio"] }
fred = { version = "10", optional = true, features = ["i-scripts"] }

[features]
default = []
a2a-v1 = ["dep:a2a-protocol-types"]
# Enable YAML agent definition loading and hot reload
yaml-agent = ["dep:serde_yaml", "dep:notify", "dep:regex"]
# Enable Agent Registry REST API
agent-registry = []
# Enable built-in A2A interceptors (auth, rate-limit, audit)
a2a-interceptors = []
# Enable OpenAI webhook handler for background task completion events
openai-webhooks = ["dep:hmac", "dep:sha2", "dep:hex"]
# Signed inbound webhooks (`POST /hooks/{name}`) that enqueue durable runs
webhook-ingress = ["adk-core/webhooks"]
# Enable background run endpoints and cron job management
background = ["adk-core/cron"]
# Approval inbox endpoints, the approval ticker, and the signed approval webhook notifier
approvals = ["adk-core/webhook-delivery"]
# Enable the Gemini Enterprise Agent Platform (ReasoningEngine) dispatch surface
# and the turnkey serve_agent_engine entrypoint (tokio/net for the listener)
agent-engine = ["dep:adk-memory", "tokio/net"]
# Remote ReasoningEngine invocation: call other deployed Agent Engine agents
# as sub-agents over reasoningEngines:streamQuery (alt=sse)
# The AWP 2.0 agent edge: `ServerBuilder::awp(AwpEdge)`, trust tiers from verified credentials,
# capabilities over A2A, MCP and HTTP through one governed path, held and exactly-once calls,
# and the public partition's conversation endpoints (spec 3.5 §7.3, §7.4, §7.9, §7.10)
awp = [
    "a2a-v1",
    "dep:adk-awp",
    "dep:awp-types",
    "dep:adk-auth",
    "dep:adk-tool",
    "adk-tool/mcp-server",
    "dep:http",
    "dep:sha2",
    "dep:hex",
    "dep:hmac",
    "adk-core/webhook-delivery",
    "axum/ws",
    "tokio/net",
]
# The edge stores of spec 3.5 §7.9 in SQLite, PostgreSQL or Redis.
awp-sqlite = ["awp", "dep:sqlx", "sqlx/sqlite", "adk-session/sqlite"]
awp-postgres = ["awp", "dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs", "adk-session/postgres"]
awp-redis = ["awp", "dep:fred"]
vertex-remote-engine = [
    "agent-engine",
    "dep:adk-gcp",
    "dep:adk-tool",
    "adk-tool/vertex-agent-registry",
    "dep:google-cloud-auth",
]

[dev-dependencies]
# Input guardrails on the agents a recovering durable worker resumes.
adk-agent = { path = "../adk-agent", features = ["guardrails"] }
adk-graph = { path = "../adk-graph" }
# ScriptedLlm for the durable worker's suspend and resume tests; Anthropic for the edge's live
# conversation run (`awp`, ignored by default).
adk-model = { path = "../adk-model", default-features = false, features = ["anthropic"] }
adk-session = { path = "../adk-session", features = ["sqlite", "postgres"] }
async-stream.workspace = true
tracing-subscriber = "0.3"
uuid = { version = "1.23", features = ["v4"] }
async-trait = "0.1"
chrono = "0.4"
hyper = "1.8.1"
http-body-util = "0.1.3"
proptest = "1.4"
tempfile = "3"
tokio-test = "0.4"
# The edge's chat socket tests (`awp`).
tokio-tungstenite = "0.28"
# The edge store conformance suite runs on a multi-threaded runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
