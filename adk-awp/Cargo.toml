[package]
name = "adk-awp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage = "https://agenticwebprotocol.com"
repository.workspace = true
description = "Agentic Web Protocol (AWP) implementation for ADK-Rust"
documentation = "https://docs.rs/adk-awp"
readme = "README.md"
keywords = ["awp", "agent", "adk", "protocol", "agentic"]
categories = ["web-programming::http-server", "api-bindings"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[dependencies]
awp-types = { workspace = true }
adk-core = { workspace = true, features = ["webhook-delivery"] }
axum = { version = "0.8", features = ["macros"] }
tokio = { workspace = true, features = ["sync", "time", "fs", "rt"] }
async-trait = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
arc-swap = "1"
hmac = "0.12"
sha2 = { workspace = true }
hex = { workspace = true }
dashmap = "6"
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
bytes = "1"
jsonschema = { workspace = true }
adk-auth = { workspace = true, optional = true, features = ["signed-audit"] }
base64 = { version = "0.22", optional = true }
zeroize = { version = "1.8.2", optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
proptest = "1"
tempfile = "3"

[features]
default = ["awp-v1"]
# The AWP 1.x routes (`awp_routes`, `AwpState`), served beside 2.0 for one release line
# (spec 3.5 §4.1, §7.1).
awp-v1 = []
# Detached JWS (EdDSA) over JCS, keys and delegations, the DNS root anchor, the site log's
# tiles and checkpoint, and `StaticBundle` (spec 3.5 §7.2, §7.7, D-11, A-I5).
signing = ["dep:adk-auth", "dep:base64", "dep:zeroize"]
# `verify` (the library behind `adk-rust awp verify`), the conformance kit and the test-vector
# generator; fetches over HTTPS (spec 3.5 §7.7).
verify = ["signing", "dep:reqwest"]
