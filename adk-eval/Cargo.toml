[package]
name = "adk-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Agent evaluation framework for ADK-Rust"
repository = "https://github.com/zavora-ai/adk-rust"
documentation = "https://docs.rs/adk-eval"
readme = "README.md"
homepage.workspace = true

[package.metadata.docs.rs]
features = ["embedding", "ci-helpers", "statistics", "vertex-eval", "personas", "experiments"]
keywords = ["ai", "agent", "evaluation", "testing", "llm"]
categories = ["development-tools::testing"]

[dependencies]
adk-core.workspace = true
adk-runner.workspace = true
adk-session.workspace = true
adk-model.workspace = true
adk-memory = { workspace = true, optional = true }
adk-gcp = { workspace = true, optional = true }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
tracing.workspace = true
quick-xml = { version = "0.41", optional = true }
statrs = { version = "0.18", optional = true }
libm = { version = "0.2", optional = true }
reqwest = { workspace = true, optional = true }
google-cloud-auth = { version = "1.8", optional = true, default-features = false, features = ["default-rustls-provider"] }

[features]
default = []
# User personas for evaluation (User_Simulator, Persona_Profile, PersonaRegistry)
personas = []
# EmbeddingScorer requires EmbeddingProvider from adk-memory
embedding = ["dep:adk-memory", "adk-memory/embedding-trait"]
# JUnit XML generation for CI integration
ci-helpers = ["dep:quick-xml"]
# Statistical testing (Wilcoxon signed-rank) for A/B comparison
statistics = ["dep:statrs"]
# Sequential and Bayesian analysis of web experiments with guardrails (spec 3.5 §7.12)
experiments = ["dep:libm"]
# Gen AI Evaluation Service bridge (Vertex AI projects.locations:evaluateInstances)
vertex-eval = ["adk-gcp", "google-cloud-auth", "reqwest"]

[dev-dependencies]
adk-agent = { path = "../adk-agent" }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-test = "0.4"
tempfile = "3.0"
proptest = "1.5"
axum = "0.8"
